---
# ============================================================
# Base packages for all Ubuntu servers
# ============================================================

server_packages:
  - ca-certificates
  - curl
  - wget
  - vim
  - htop
  - jq
  - git
  - rsync
  - chrony
  - locales
  - logrotate

# ============================================================
# UFW packages
# ============================================================

firewall_packages:
  - ufw

# ============================================================
# Official Docker Engine, CLI, containerd, Buildx and Compose
# ============================================================

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin