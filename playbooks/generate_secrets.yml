
---
- name: Generate server secrets
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../vars/dirs.yml"
    - "{{ vaults_dir }}/master.vault"

  vars:
    host_specs_file: "{{ vars_dir }}/host_vars/{{ hostname }}.yml"
    overwrite: false

  tasks:
    # ============================================================
    # Validate hostname argument
    # ============================================================

    - name: Validate hostname argument
      ansible.builtin.assert:
        that:
          - hostname is defined
          - hostname | default('') is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
        fail_msg: "Bitte einen gültigen Hostnamen über -e hostname=<hostname> übergeben."

    # ============================================================
    # Load host specifications
    # ============================================================

    - name: Load host specifications
      ansible.builtin.include_tasks:
        file: "{{ tasks_dir }}/host_specs/load.yml"
        apply:
          become: false
      vars:
        host_specs_path: "{{ host_specs_file }}"
        host_specs_expected_hostname: "{{ hostname }}"

    # ============================================================
    # Validate secrets state
    # ============================================================

    - name: Verify secrets generation is allowed
      ansible.builtin.assert:
        that:
          - host_specs.secrets is not defined or host_specs.secrets is boolean
          - >-
            (overwrite | default(false) | bool)
            or not (host_specs.secrets | default(false) | bool)
        fail_msg: >-
          Die Secrets für {{ hostname }} wurden bereits generiert
          oder der Secrets-Status ist ungültig.
          Verwende overwrite=true, um die Secrets neu zu generieren.
        success_msg: >-
          Die Secret-Generierung für {{ hostname }} ist freigegeben.

    # ============================================================
    # Load existing Vaults
    # ============================================================

    - name: Load existing Vaults
      ansible.builtin.include_tasks:
        file: "{{ tasks_dir }}/vault/load.yml"
        apply:
          become: false

      loop:

        # Ansible sudo passwords
        - file: "{{ vaults_dir }}/ansible_sudo_passwords.vault"
          id: ansible_sudo_passwords
          password: "{{ master_vault.ansible_sudo_passwords_vault_password }}"
          key: sudo_passwords
          fact: sudo_passwords_vault

        # SSH key passphrases
        - file: "{{ vaults_dir }}/ssh_keys_passphrases.vault"
          id: ssh_keys_passphrases
          password: "{{ master_vault.ssh_keys_passphrases_vault_password }}"
          key: ssh_keys_passphrases
          fact: key_passphrases_vault

        # SSH key Vault passwords
        - file: "{{ vaults_dir }}/ssh_keys_vaults_passwords.vault"
          id: ssh_keys_vaults_passwords
          password: "{{ master_vault.ssh_keys_vaults_passwords_vault_password }}"
          key: vaults
          fact: vault_passwords_vault

        # sudo passwords salts
        - file: "{{ vaults_dir }}/sudo_passwords_salts.vault"
          id: sudo_passwords_salts
          password: "{{ master_vault.sudo_passwords_salts_vault_password }}"
          key: salts
          fact: sudo_passwords_salts_vault

      loop_control:
        loop_var: loaded_vault
        label: "{{ loaded_vault.file | basename }}"

      vars:
        vault_load_file: "{{ loaded_vault.file }}"
        vault_load_id: "{{ loaded_vault.id }}"
        vault_load_password: "{{ loaded_vault.password }}"
        vault_load_key: "{{ loaded_vault.key }}"
        vault_load_fact: "{{ loaded_vault.fact }}"

      no_log: true

    # ============================================================
    # Generate passwords and salts
    # ============================================================

    - name: Generate passwords and salts
      ansible.builtin.include_tasks:
        file: "{{ tasks_dir }}/system/generate_secret.yml"

      loop:
        - variable: generated_sudo_password
          length: 64

        - variable: generated_ssh_key_passphrase
          length: 64

        - variable: generated_ssh_key_vault_password
          length: 64

        - variable: generated_sudo_password_salt
          length: 16

      loop_control:
        loop_var: generated_secret
        label: "{{ generated_secret.variable }}"

      vars:
        secret_variable_name: "{{ generated_secret.variable }}"
        secret_length: "{{ generated_secret.length }}"

      no_log: true

    # ============================================================
    # Generate and encrypt SSH key pair
    # ============================================================

    - name: Generate and encrypt SSH key pair
      block:

        - name: Create temporary SSH key directory
          ansible.builtin.tempfile:
            state: directory
            prefix: ansible_ssh_
          register: ssh_key_temp_dir

        - name: Generate Ed25519 SSH key pair
          ansible.builtin.command:
            argv:
              - ssh-keygen
              - -q
              - -t
              - ed25519
              - -a
              - "100"
              - -C
              - "{{ hostname }}"
              - -N
              - "{{ generated_ssh_key_passphrase }}"
              - -f
              - "{{ ssh_key_temp_dir.path }}/{{ hostname }}"
          no_log: true

        - name: Encrypt and save private SSH key
          ansible.builtin.copy:
            dest: "{{ vaults_dir }}/private_keys/{{ hostname }}.vault"
            mode: '0600'
            decrypt: false
            content: >-
              {{
                lookup(
                  'ansible.builtin.file',
                  ssh_key_temp_dir.path ~ '/' ~ hostname,
                  rstrip=false
                )
                | ansible.builtin.vault(
                    generated_ssh_key_vault_password,
                    vault_id=hostname
                  )
              }}
          no_log: true

        - name: Save public SSH key
          ansible.builtin.copy:
            src: "{{ ssh_key_temp_dir.path }}/{{ hostname }}.pub"
            dest: "{{ public_keys_dir }}/{{ hostname }}.pub"
            mode: '0644'

      always:

        - name: Remove temporary SSH key directory
          ansible.builtin.file:
            path: "{{ ssh_key_temp_dir.path }}"
            state: absent
          when:
            - ssh_key_temp_dir is defined
            - ssh_key_temp_dir.path is defined

    # ============================================================
    # Save generated secrets to Vaults
    # ============================================================

    - name: Save generated secrets to Vaults
      ansible.builtin.include_tasks:
        file: "{{ tasks_dir }}/vault/save.yml"

      loop:

        # Ansible sudo passwords
        - file: "{{ vaults_dir }}/ansible_sudo_passwords.vault"
          id: ansible_sudo_passwords
          password: "{{ master_vault.ansible_sudo_passwords_vault_password }}"
          key: sudo_passwords
          entries: "{{ sudo_passwords_vault }}"
          value: "{{ generated_sudo_password }}"

        # SSH key passphrases
        - file: "{{ vaults_dir }}/ssh_keys_passphrases.vault"
          id: ssh_keys_passphrases
          password: "{{ master_vault.ssh_keys_passphrases_vault_password }}"
          key: ssh_keys_passphrases
          entries: "{{ key_passphrases_vault }}"
          value: "{{ generated_ssh_key_passphrase }}"

        # SSH key Vault passwords
        - file: "{{ vaults_dir }}/ssh_keys_vaults_passwords.vault"
          id: ssh_keys_vaults_passwords
          password: "{{ master_vault.ssh_keys_vaults_passwords_vault_password }}"
          key: vaults
          entries: "{{ vault_passwords_vault }}"
          value: "{{ generated_ssh_key_vault_password }}"

        # sudo passwords salts
        - file: "{{ vaults_dir }}/sudo_passwords_salts.vault"
          id: sudo_passwords_salts
          password: "{{ master_vault.sudo_passwords_salts_vault_password }}"
          key: salts
          entries: "{{ sudo_passwords_salts_vault }}"
          value: "{{ generated_sudo_password_salt }}"

      loop_control:
        loop_var: generated_vault
        label: "{{ generated_vault.file | basename }}"

      vars:
        vault_save_file: "{{ generated_vault.file }}"
        vault_save_id: "{{ generated_vault.id }}"
        vault_save_password: "{{ generated_vault.password }}"
        vault_save_key: "{{ generated_vault.key }}"
        vault_save_entries: "{{ generated_vault.entries }}"
        vault_save_host: "{{ hostname }}"
        vault_save_value: "{{ generated_vault.value }}"

      no_log: true

    # ============================================================
    # Mark secrets as generated
    # ============================================================

    - name: Mark secrets as generated
      ansible.builtin.lineinfile:
        path: "{{ host_specs_file }}"
        regexp: '^secrets\s*:'
        line: 'secrets: true'
        state: present
        create: false
      become: false
