---
- name: Generate server secrets
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../vars/dirs.yml"
    - "{{ vaults_dir }}/master.vault"

  vars:
    host_specs_file: "{{ vars_dir }}/host_vars/{{ hostname }}.yml"
    overwrite: false

  tasks:

    - name: Validate hostname argument
      ansible.builtin.assert:
        that:
          - hostname is defined
          - hostname | default('') is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
        fail_msg: "Bitte einen gültigen Hostnamen über -e hostname=<hostname> übergeben."

    # ============================================================
    # Load host specifications
    # ============================================================

    - name: Load host specifications
      ansible.builtin.include_tasks:
        file: "{{ tasks_dir }}/host_specs/load.yml"
        apply:
          become: false
      vars:
        host_specs_path: "{{ host_specs_file }}"
        host_specs_expected_hostname: "{{ hostname }}"

    # ============================================================
    # Validate secrets state
    # ============================================================

    - name: Verify secrets are not generated
      ansible.builtin.assert:
        that:
          - host_specs.secrets is not defined or host_specs.secrets is boolean
          - not (host_specs.secrets | default(false) | bool)
        fail_msg: >-
          Die Secrets für {{ hostname }} wurden bereits generiert
          oder der Secrets-Status ist ungültig.
          Eine erneute Generierung ist nicht erlaubt.
        success_msg: >-
          Die Secrets für {{ hostname }} wurden noch nicht generiert.
          Die Generierung darf gestartet werden.
    
    # ============================================================
    # Load connection Vaults
    # ============================================================

    - name: Load connection Vaults
      ansible.builtin.include_tasks:
        file: "{{ tasks_dir }}/vault/load_connection.yml"
        apply:
          become: false

    # ============================================================
    # Load sudo password salts Vault
    # ============================================================

    - name: Load sudo password salts Vault
      ansible.builtin.include_tasks:
        file: "{{ tasks_dir }}/vault/load.yml"
        apply:
          become: false
      vars:
        vault_load_file: "{{ vaults_dir }}/sudo_passwords_salts.vault"
        vault_load_password: "{{ master_vault.sudo_passwords_salts_vault_password }}"
        vault_load_id: sudo_passwords_salts
        vault_load_key: salts
        vault_load_fact: sudo_passwords_salts_vault
      no_log: true

    - name: Check private SSH key Vault
      ansible.builtin.stat:
        path: "{{ vaults_dir }}/private_keys/{{ hostname }}.vault"
      register: private_key_vault_stat

    - name: Check public SSH key
      ansible.builtin.stat:
        path: "{{ public_keys_dir }}/{{ hostname }}.pub"
      register: public_key_stat

    - name: Verify existing server secrets
      ansible.builtin.assert:
        that:
          # Private SSH key Vault
          - >-
            (overwrite | default(false) | bool)
            or not private_key_vault_stat.stat.exists

          # Public SSH key
          - >-
            (overwrite | default(false) | bool)
            or not public_key_stat.stat.exists

          # SSH key Vault password
          - >-
            (overwrite | default(false) | bool)
            or hostname not in vault_passwords_vault

          # SSH key passphrase
          - >-
            (overwrite | default(false) | bool)
            or hostname not in key_passphrases_vault

          # Ansible sudo password
          - >-
            (overwrite | default(false) | bool)
            or hostname not in sudo_passwords_vault

        fail_msg: >-
          Für {{ hostname }} existieren bereits SSH-Schlüssel
          oder Vault-Einträge.
          Verwende overwrite=true, um diese bewusst zu überschreiben.

        success_msg: >-
          Alle Prüfungen für {{ hostname }} erfolgreich.
          Generierung der Secrets ist erlaubt.

    - name: Generate sudo and vault password, SSH key passphrase and salt
      ansible.builtin.set_fact:
        generated_sudo_password: >-
          {{
            lookup(
              'ansible.builtin.password',
              '/dev/null',
              length=64,
              chars=['ascii_letters', 'digits']
            )
          }}

        generated_ssh_key_passphrase: >-
          {{
            lookup(
              'ansible.builtin.password',
              '/dev/null',
              length=64,
              chars=['ascii_letters', 'digits']
            )
          }}

        generated_ssh_key_vault_password: >-
          {{
            lookup(
              'ansible.builtin.password',
              '/dev/null',
              length=64,
              chars=['ascii_letters', 'digits']
            )
          }}

        generated_sudo_password_salt: >-
          {{
            lookup(
              'ansible.builtin.password',
              '/dev/null',
              length=16,
              chars=['ascii_letters', 'digits']
            )
          }}
      no_log: true

    - name: Generate and encrypt SSH key pair
      block:

        - name: Create temporary SSH key directory
          ansible.builtin.tempfile:
            state: directory
            prefix: ansible_ssh_
          register: ssh_key_temp_dir

        - name: Generate Ed25519 SSH key pair
          ansible.builtin.command:
            argv:
              - ssh-keygen
              - -q
              - -t
              - ed25519
              - -a
              - "100"
              - -C
              - "{{ hostname }}"
              - -N
              - "{{ generated_ssh_key_passphrase }}"
              - -f
              - "{{ ssh_key_temp_dir.path }}/{{ hostname }}"
          no_log: true

        - name: Encrypt and save private SSH key
          ansible.builtin.copy:
            dest: "{{ vaults_dir }}/private_keys/{{ hostname }}.vault"
            mode: '0600'
            decrypt: false
            content: >-
              {{
                lookup(
                  'ansible.builtin.file',
                  ssh_key_temp_dir.path ~ '/' ~ hostname,
                  rstrip=false
                )
                | ansible.builtin.vault(
                    generated_ssh_key_vault_password,
                    vault_id=hostname
                  )
              }}
          no_log: true

        - name: Save public SSH key
          ansible.builtin.copy:
            src: "{{ ssh_key_temp_dir.path }}/{{ hostname }}.pub"
            dest: "{{ public_keys_dir }}/{{ hostname }}.pub"
            mode: '0644'

      always:

        - name: Remove temporary SSH key directory
          ansible.builtin.file:
            path: "{{ ssh_key_temp_dir.path }}"
            state: absent
          when:
            - ssh_key_temp_dir is defined
            - ssh_key_temp_dir.path is defined

    - name: Save sudo password to Vault
      ansible.builtin.copy:
        dest: "{{ vaults_dir }}/ansible_sudo_passwords.vault"
        mode: '0600'
        decrypt: false
        content: >-
          {{
            {
              'sudo_passwords': (
                sudo_passwords_vault
                | combine({
                    hostname: generated_sudo_password
                  })
              )
            }
            | to_nice_yaml(indent=2, sort_keys=false)
            | ansible.builtin.vault(
                master_vault.sudo_passwords_vault_password,
                vault_id='ansible_sudo_passwords'
              )
          }}
      no_log: true

    - name: Save SSH key passphrase to Vault
      ansible.builtin.copy:
        dest: "{{ vaults_dir }}/ssh_keys_passphrases.vault"
        mode: '0600'
        decrypt: false
        content: >-
          {{
            {
              'ssh_keys_passphrases': (
                key_passphrases_vault
                | combine({
                    hostname: generated_ssh_key_passphrase
                  })
              )
            }
            | to_nice_yaml(indent=2, sort_keys=false)
            | ansible.builtin.vault(
                master_vault.key_passphrases_vault_password,
                vault_id='ssh_keys_passphrases'
              )
          }}
      no_log: true

    - name: Save SSH key Vault password
      ansible.builtin.copy:
        dest: "{{ vaults_dir }}/ssh_keys_vaults_passwords.vault"
        mode: '0600'
        decrypt: false
        content: >-
          {{
            {
              'vaults': (
                vault_passwords_vault
                | combine({
                    hostname: generated_ssh_key_vault_password
                  })
              )
            }
            | to_nice_yaml(indent=2, sort_keys=false)
            | ansible.builtin.vault(
                master_vault.vault_passwords_vault_password,
                vault_id='ssh_keys_vaults_passwords'
              )
          }}
      no_log: true

    - name: Save sudo passwords salts Vault
      ansible.builtin.copy:
        dest: "{{ vaults_dir }}/sudo_passwords_salts.vault"
        mode: '0600'
        decrypt: false
        content: >-
          {{
            {
              'salts': (
                sudo_passwords_salts_vault
                | combine({
                    hostname: generated_sudo_password_salt
                  })
              )
            }
            | to_nice_yaml(indent=2, sort_keys=false)
            | ansible.builtin.vault(
                master_vault.sudo_passwords_salts_vault_password,
                vault_id='sudo_passwords_salts'
              )
          }}
      no_log: true

    # ============================================================
    # Mark secrets as generated
    # ============================================================

    - name: Mark secrets as generated
      ansible.builtin.lineinfile:
        path: "{{ host_specs_file }}"
        regexp: '^secrets\s*:'
        line: 'secrets: true'
        state: present
        create: false
      become: false
