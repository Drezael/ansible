---
- name: Rotate server secrets
  hosts: "{{ hostname }}"
  serial: 1
  any_errors_fatal: true
  remote_user: ansible
  become: false
  become_method: sudo
  become_user: root
  become_exe: /usr/bin/sudo.ws
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../vars/dirs.yml"
    - "{{ vaults_dir }}/master.vault"

  vars:
    rotation_confirm: false
    host_specs_file: "{{ vars_dir }}/host_vars/{{ inventory_hostname }}.yml"
    rotation_backup_root: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ansible/rotation-backups"
    rotation_backup_dir: "{{ rotation_backup_root }}/{{ inventory_hostname }}"
    rotation_global_lock_dir: "{{ rotation_backup_root }}/.vault-rotation.lock"
    rotation_authorized_keys_path: "/home/{{ service_user.user_name }}/.ssh/authorized_keys"

    rotation_vaults:
      - file: "{{ vaults_dir }}/ansible_sudo_passwords.vault"
        id: ansible_sudo_passwords
        password: "{{ master_vault.ansible_sudo_passwords_vault_password }}"
        key: sudo_passwords
        fact: sudo_passwords_vault
        new_fact: generated_sudo_password

      - file: "{{ vaults_dir }}/ssh_keys_passphrases.vault"
        id: ssh_keys_passphrases
        password: "{{ master_vault.ssh_keys_passphrases_vault_password }}"
        key: ssh_keys_passphrases
        fact: key_passphrases_vault
        new_fact: generated_ssh_key_passphrase

      - file: "{{ vaults_dir }}/ssh_keys_vaults_passwords.vault"
        id: ssh_keys_vaults_passwords
        password: "{{ master_vault.ssh_keys_vaults_passwords_vault_password }}"
        key: vaults
        fact: vault_passwords_vault
        new_fact: generated_ssh_key_vault_password

      - file: "{{ vaults_dir }}/sudo_passwords_salts.vault"
        id: sudo_passwords_salts
        password: "{{ master_vault.sudo_passwords_salts_vault_password }}"
        key: salts
        fact: sudo_passwords_salts_vault
        new_fact: generated_sudo_password_salt

    rotation_backup_files:
      - source: "{{ vaults_dir }}/ansible_sudo_passwords.vault"
        name: ansible_sudo_passwords.vault
      - source: "{{ vaults_dir }}/ssh_keys_passphrases.vault"
        name: ssh_keys_passphrases.vault
      - source: "{{ vaults_dir }}/ssh_keys_vaults_passwords.vault"
        name: ssh_keys_vaults_passwords.vault
      - source: "{{ vaults_dir }}/sudo_passwords_salts.vault"
        name: sudo_passwords_salts.vault
      - source: "{{ vaults_dir }}/private_keys/{{ inventory_hostname }}.vault"
        name: private_key.vault
      - source: "{{ public_keys_dir }}/{{ inventory_hostname }}.pub"
        name: public_key.pub

  pre_tasks:
    # ============================================================
    # Preconditions (no remote changes)
    # ============================================================

    - name: Validate rotation request
      ansible.builtin.assert:
        that:
          - hostname is defined
          - hostname | default('') is match('^[A-Za-z0-9][A-Za-z0-9._-]*(,[A-Za-z0-9][A-Za-z0-9._-]*)*$')
          - inventory_hostname is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
          - inventory_hostname not in ['.', '..']
          - rotation_confirm | bool
          - not ansible_check_mode
        fail_msg: >-
          Ungueltiges Rotationsziel oder fehlende Bestaetigung.
          Bitte -e hostname=<host|host1,host2|all> -e rotation_confirm=true verwenden.

    - name: Load host specifications
      ansible.builtin.include_tasks:
        file: "{{ tasks_dir }}/host_specs/load.yml"
        apply:
          become: false
      vars:
        host_specs_path: "{{ host_specs_file }}"
        host_specs_expected_hostname: "{{ inventory_hostname }}"

    - name: Require completed bootstrap and generated secrets
      ansible.builtin.assert:
        that:
          - host_specs.bootstrap is defined
          - host_specs.bootstrap is sameas true
          - host_specs.secrets is defined
          - host_specs.secrets is sameas true
        fail_msg: >-
          {{ inventory_hostname }} muss bereits gebootstrappt sein und
          gueltige Secrets besitzen. Rotation wird verweigert.

    - name: Load Ansible service user declaration
      ansible.builtin.include_vars:
        file: "{{ vars_dir }}/users/ansible.yml"
        name: service_user

    - name: Load current Vaults
      ansible.builtin.include_tasks:
        file: "{{ tasks_dir }}/vault/load.yml"
        apply:
          become: false
      loop: "{{ rotation_vaults }}"
      loop_control:
        loop_var: rotation_vault
        label: "{{ rotation_vault.file | basename }}"
      vars:
        vault_load_file: "{{ rotation_vault.file }}"
        vault_load_id: "{{ rotation_vault.id }}"
        vault_load_password: "{{ rotation_vault.password }}"
        vault_load_key: "{{ rotation_vault.key }}"
        vault_load_fact: "{{ rotation_vault.fact }}"
      no_log: true

    - name: Verify all current host secrets exist
      ansible.builtin.assert:
        that:
          - inventory_hostname in sudo_passwords_vault
          - inventory_hostname in key_passphrases_vault
          - inventory_hostname in vault_passwords_vault
          - inventory_hostname in sudo_passwords_salts_vault
        fail_msg: >-
          Mindestens ein bisheriges Secret fuer {{ inventory_hostname }} fehlt.
        quiet: true
      no_log: true

    - name: Configure existing Ansible service connection
      ansible.builtin.include_tasks:
        file: "{{ tasks_dir }}/connection/configure.yml"
        apply:
          become: false
      vars:
        connection_user: "{{ service_user.user_name }}"
        connection_key_name: "{{ inventory_hostname }}"
        connection_sudo_key: "{{ inventory_hostname }}"

    - name: Save current credentials for rollback
      ansible.builtin.set_fact:
        rotation_old_private_key: "{{ ansible_private_key }}"
        rotation_old_key_passphrase: "{{ ansible_private_key_passphrase }}"
        rotation_old_sudo_password: "{{ sudo_passwords_vault[inventory_hostname] }}"
        rotation_old_sudo_salt: "{{ sudo_passwords_salts_vault[inventory_hostname] }}"
        rotation_old_key_vault_password: "{{ vault_passwords_vault[inventory_hostname] }}"
        rotation_old_public_key: >-
          {{ lookup('ansible.builtin.file', public_keys_dir ~ '/' ~ inventory_hostname ~ '.pub') | trim }}
      no_log: true

    - name: Verify current SSH authentication
      ansible.builtin.command:
        cmd: /usr/bin/id -un
      register: rotation_initial_ssh
      changed_when: false
      failed_when: >-
        rotation_initial_ssh.rc != 0 or
        rotation_initial_ssh.stdout | trim != service_user.user_name

    - name: Verify current sudo authentication
      ansible.builtin.command:
        cmd: /usr/bin/id -u
      become: true
      register: rotation_initial_sudo
      changed_when: false
      failed_when: >-
        rotation_initial_sudo.rc != 0 or
        rotation_initial_sudo.stdout | trim != '0'
      no_log: true

    - name: Read existing authorized keys
      ansible.builtin.slurp:
        src: "{{ rotation_authorized_keys_path }}"
      register: rotation_authorized_keys_result
      no_log: true

    - name: Remember authorized keys before rotation
      ansible.builtin.set_fact:
        rotation_authorized_keys_before: "{{ rotation_authorized_keys_result.content | b64decode }}"
      no_log: true

    - name: Require old managed SSH key to be authorized
      ansible.builtin.assert:
        that:
          - rotation_old_public_key in rotation_authorized_keys_before.splitlines()
        fail_msg: >-
          Der bisherige SSH-Public-Key ist auf {{ inventory_hostname }}
          nicht als exakter Eintrag in authorized_keys vorhanden.

    # ============================================================
    # Local recovery lock
    # ============================================================

    - name: Create local rotation backup root
      ansible.builtin.file:
        path: "{{ rotation_backup_root }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Refuse rotation when a previous recovery directory exists
      ansible.builtin.stat:
        path: "{{ rotation_backup_dir }}"
      delegate_to: localhost
      become: false
      register: rotation_prior_backup

    - name: Validate no unfinished rotation exists
      ansible.builtin.assert:
        that:
          - not rotation_prior_backup.stat.exists
        fail_msg: >-
          Eine fruehere Rotation fuer {{ inventory_hostname }} ist noch offen:
          {{ rotation_backup_dir }}. Zuerst den Zustand untersuchen.

  tasks:
    # ============================================================
    # Transaction: prepare, stage, verify, commit, revoke
    # ============================================================

    - name: Rotate access credentials with rollback
      block:
        - name: Acquire global Vault writer lock
          ansible.builtin.command:
            argv:
              - mkdir
              - -m
              - '0700'
              - "{{ rotation_global_lock_dir }}"
          delegate_to: localhost
          become: false

        - name: Remember acquired global Vault lock
          ansible.builtin.set_fact:
            rotation_global_lock_acquired: true

        - name: Reserve local recovery directory
          ansible.builtin.command:
            argv:
              - mkdir
              - -m
              - '0700'
              - "{{ rotation_backup_dir }}"
          delegate_to: localhost
          become: false

        - name: Remember reserved local recovery directory
          ansible.builtin.set_fact:
            rotation_backup_created: true

        - name: Back up current encrypted Vaults and SSH keys
          ansible.builtin.copy:
            src: "{{ item.source }}"
            dest: "{{ rotation_backup_dir }}/{{ item.name }}"
            remote_src: true
            mode: '0600'
          delegate_to: localhost
          become: false
          loop: "{{ rotation_backup_files }}"
          loop_control:
            label: "{{ item.name }}"
          no_log: true

        - name: Generate new per-host secrets
          ansible.builtin.include_tasks:
            file: "{{ tasks_dir }}/system/generate_secret.yml"
          loop:
            - variable: generated_sudo_password
              length: 64
            - variable: generated_ssh_key_passphrase
              length: 64
            - variable: generated_ssh_key_vault_password
              length: 64
            - variable: generated_sudo_password_salt
              length: 16
          loop_control:
            loop_var: rotation_secret
            label: "{{ rotation_secret.variable }}"
          vars:
            secret_variable_name: "{{ rotation_secret.variable }}"
            secret_length: "{{ rotation_secret.length }}"
          no_log: true

        - name: Create temporary SSH key directory on controller
          ansible.builtin.tempfile:
            state: directory
            prefix: ansible_rotate_ssh_
          delegate_to: localhost
          become: false
          register: rotation_ssh_temp_dir

        - name: Generate new Ed25519 SSH key pair
          ansible.builtin.command:
            argv:
              - ssh-keygen
              - -q
              - -t
              - ed25519
              - -a
              - '100'
              - -C
              - "{{ inventory_hostname }}"
              - -N
              - "{{ generated_ssh_key_passphrase }}"
              - -f
              - "{{ rotation_ssh_temp_dir.path }}/{{ inventory_hostname }}"
          delegate_to: localhost
          become: false
          no_log: true

        - name: Read generated SSH keys into memory
          ansible.builtin.set_fact:
            rotation_new_private_key: "{{ lookup('ansible.builtin.file', rotation_ssh_temp_dir.path ~ '/' ~ inventory_hostname, rstrip=false) }}"
            rotation_new_public_key: "{{ lookup('ansible.builtin.file', rotation_ssh_temp_dir.path ~ '/' ~ inventory_hostname ~ '.pub') | trim }}"
          no_log: true

        - name: Ensure new SSH key differs from existing key
          ansible.builtin.assert:
            that:
              - rotation_new_public_key != rotation_old_public_key

        - name: Save encrypted recovery journal before server changes
          ansible.builtin.copy:
            dest: "{{ rotation_backup_dir }}/recovery.vault"
            mode: '0600'
            decrypt: false
            content: >-
              {{
                {
                  'hostname': inventory_hostname,
                  'old': {
                    'private_key': rotation_old_private_key,
                    'key_passphrase': rotation_old_key_passphrase,
                    'key_vault_password': rotation_old_key_vault_password,
                    'sudo_password': rotation_old_sudo_password,
                    'sudo_salt': rotation_old_sudo_salt,
                    'authorized_keys': rotation_authorized_keys_before
                  },
                  'new': {
                    'private_key': rotation_new_private_key,
                    'public_key': rotation_new_public_key,
                    'key_passphrase': generated_ssh_key_passphrase,
                    'key_vault_password': generated_ssh_key_vault_password,
                    'sudo_password': generated_sudo_password,
                    'sudo_salt': generated_sudo_password_salt
                  }
                }
                | to_nice_yaml(indent=2, sort_keys=false)
                | ansible.builtin.vault(
                    master_vault.ansible_sudo_passwords_vault_password,
                    vault_id='ansible_sudo_passwords'
                  )
              }}
          delegate_to: localhost
          become: false
          no_log: true

        # ============================================================
        # Stage and verify new SSH access before revoking old access
        # ============================================================

        - name: Mark beginning of server-side modifications
          ansible.builtin.set_fact:
            rotation_remote_changes_started: true

        - name: Authorize additional new SSH public key
          ansible.builtin.include_tasks:
            file: "{{ tasks_dir }}/ssh/public_key.yml"
            apply:
              become: true
          vars:
            ssh_user_name: "{{ service_user.user_name }}"
            ssh_user_primary_group: "{{ service_user.primary_group | default(service_user.user_name) }}"
            ssh_public_key: "{{ rotation_new_public_key }}"
            state: present

        - name: Switch to new SSH key for authentication test
          ansible.builtin.set_fact:
            ansible_private_key: "{{ rotation_new_private_key }}"
            ansible_private_key_passphrase: "{{ generated_ssh_key_passphrase }}"
            ansible_become_password: "{{ rotation_old_sudo_password }}"
          no_log: true

        - name: Reset connection before new SSH test
          ansible.builtin.meta: reset_connection

        - name: Wait for SSH login with new credentials
          ansible.builtin.wait_for_connection:
            connect_timeout: 5
            sleep: 2
            timeout: 40
          become: false
          register: rotation_wait_connection
          ignore_unreachable: true
          ignore_errors: true

        - name: Assert new SSH connection is available
          ansible.builtin.assert:
            that:
              - not (rotation_wait_connection.unreachable | default(false))
              - not (rotation_wait_connection.failed | default(false))
            fail_msg: >-
              Der SSH-Verbindungstest fuer {{ inventory_hostname }} ist fehlgeschlagen.

        - name: Verify new SSH identity
          ansible.builtin.command:
            cmd: /usr/bin/id -un
          register: rotation_new_ssh_test
          changed_when: false
          failed_when: >-
            rotation_new_ssh_test.rc != 0 or
            rotation_new_ssh_test.stdout | trim != service_user.user_name

        - name: Mark new SSH identity verified
          ansible.builtin.set_fact:
            rotation_new_ssh_verified: true

        # ============================================================
        # Rotate and verify sudo password
        # ============================================================

        - name: Mark sudo password change as started
          ansible.builtin.set_fact:
            rotation_sudo_change_started: true

        - name: Set new sudo password on server
          ansible.builtin.user:
            name: "{{ service_user.user_name }}"
            password: >-
              {{
                generated_sudo_password
                | ansible.builtin.password_hash(
                    'sha512',
                    salt=generated_sudo_password_salt,
                    rounds=100000
                  )
              }}
            update_password: always
            password_lock: false
          become: true
          no_log: true

        - name: Use newly generated sudo password
          ansible.builtin.set_fact:
            ansible_become_password: "{{ generated_sudo_password }}"
          no_log: true

        - name: Clear sudo authentication cache for new password test
          ansible.builtin.command:
            cmd: /usr/bin/sudo.ws -k
          changed_when: false

        - name: Verify new sudo password
          ansible.builtin.command:
            cmd: /usr/bin/id -u
          become: true
          register: rotation_new_sudo_test
          changed_when: false
          failed_when: >-
            rotation_new_sudo_test.rc != 0 or
            rotation_new_sudo_test.stdout | trim != '0'
          no_log: true

        # ============================================================
        # Commit new secrets to the existing controller Vaults
        # ============================================================

        - name: Write all rotated secrets to Vaults
          ansible.builtin.include_tasks:
            file: "{{ tasks_dir }}/vault/save.yml"
          loop: "{{ rotation_vaults }}"
          loop_control:
            loop_var: rotation_vault
            label: "{{ rotation_vault.file | basename }}"
          vars:
            vault_save_file: "{{ rotation_vault.file }}"
            vault_save_id: "{{ rotation_vault.id }}"
            vault_save_password: "{{ rotation_vault.password }}"
            vault_save_key: "{{ rotation_vault.key }}"
            vault_save_entries: "{{ lookup('ansible.builtin.vars', rotation_vault.fact) }}"
            vault_save_host: "{{ inventory_hostname }}"
            vault_save_value: "{{ lookup('ansible.builtin.vars', rotation_vault.new_fact) }}"
          no_log: true

        - name: Save new encrypted SSH private key
          ansible.builtin.copy:
            dest: "{{ vaults_dir }}/private_keys/{{ inventory_hostname }}.vault"
            mode: '0600'
            decrypt: false
            content: >-
              {{
                rotation_new_private_key
                | ansible.builtin.vault(
                    generated_ssh_key_vault_password,
                    vault_id=inventory_hostname
                  )
              }}
          delegate_to: localhost
          become: false
          no_log: true

        - name: Save new public key on controller
          ansible.builtin.copy:
            src: "{{ rotation_ssh_temp_dir.path }}/{{ inventory_hostname }}.pub"
            dest: "{{ public_keys_dir }}/{{ inventory_hostname }}.pub"
            mode: '0644'
          delegate_to: localhost
          become: false

        # ============================================================
        # Validate persisted credentials, then retire the old key
        # ============================================================

        - name: Reload stored Vaults from disk
          ansible.builtin.include_tasks:
            file: "{{ tasks_dir }}/vault/load.yml"
            apply:
              become: false
          loop: "{{ rotation_vaults }}"
          loop_control:
            loop_var: rotation_vault
            label: "{{ rotation_vault.file | basename }}"
          vars:
            vault_load_file: "{{ rotation_vault.file }}"
            vault_load_id: "{{ rotation_vault.id }}"
            vault_load_password: "{{ rotation_vault.password }}"
            vault_load_key: "{{ rotation_vault.key }}"
            vault_load_fact: "{{ rotation_vault.fact }}"
          no_log: true

        - name: Configure connection exclusively from saved credentials
          ansible.builtin.include_tasks:
            file: "{{ tasks_dir }}/connection/configure.yml"
            apply:
              become: false
          vars:
            connection_user: "{{ service_user.user_name }}"
            connection_key_name: "{{ inventory_hostname }}"
            connection_sudo_key: "{{ inventory_hostname }}"

        - name: Wait for SSH with persisted key
          ansible.builtin.wait_for_connection:
            connect_timeout: 5
            sleep: 2
            timeout: 40
          become: false
          register: rotation_wait_connection
          ignore_unreachable: true
          ignore_errors: true

        - name: Assert persisted SSH connection is available
          ansible.builtin.assert:
            that:
              - not (rotation_wait_connection.unreachable | default(false))
              - not (rotation_wait_connection.failed | default(false))
            fail_msg: >-
              Der SSH-Verbindungstest fuer {{ inventory_hostname }} ist fehlgeschlagen.

        - name: Verify persisted SSH identity
          ansible.builtin.command:
            cmd: /usr/bin/id -un
          register: rotation_persisted_ssh_test
          changed_when: false
          failed_when: >-
            rotation_persisted_ssh_test.rc != 0 or
            rotation_persisted_ssh_test.stdout | trim != service_user.user_name

        - name: Verify persisted sudo authentication
          ansible.builtin.command:
            cmd: /usr/bin/id -u
          become: true
          register: rotation_persisted_sudo_test
          changed_when: false
          failed_when: >-
            rotation_persisted_sudo_test.rc != 0 or
            rotation_persisted_sudo_test.stdout | trim != '0'
          no_log: true

        - name: Revoke all occurrences of the previous managed SSH key
          ansible.builtin.include_tasks:
            file: "{{ tasks_dir }}/ssh/public_key.yml"
            apply:
              become: true
          vars:
            ssh_user_name: "{{ service_user.user_name }}"
            ssh_user_primary_group: "{{ service_user.primary_group | default(service_user.user_name) }}"
            ssh_public_key: "{{ rotation_old_public_key }}"
            state: absent

        - name: Verify authorized key set after revocation
          ansible.builtin.slurp:
            src: "{{ rotation_authorized_keys_path }}"
          register: rotation_final_authorized_keys
          no_log: true

        - name: Assert old key revoked and new key remains
          ansible.builtin.assert:
            that:
              - >-
                (
                  (rotation_final_authorized_keys.content | b64decode).splitlines()
                  | select('match', ssh_public_key_identity_regexp)
                  | list
                  | length
                ) == 0
              - rotation_new_public_key in (rotation_final_authorized_keys.content | b64decode).splitlines()

        - name: Force a fresh SSH connection after old key removal
          ansible.builtin.meta: reset_connection

        - name: Verify final new SSH connection
          ansible.builtin.wait_for_connection:
            connect_timeout: 5
            sleep: 2
            timeout: 40
          become: false
          register: rotation_wait_connection
          ignore_unreachable: true
          ignore_errors: true

        - name: Assert final SSH connection is available
          ansible.builtin.assert:
            that:
              - not (rotation_wait_connection.unreachable | default(false))
              - not (rotation_wait_connection.failed | default(false))
            fail_msg: >-
              Der SSH-Verbindungstest fuer {{ inventory_hostname }} ist fehlgeschlagen.

        - name: Verify final new sudo authentication
          ansible.builtin.command:
            cmd: /usr/bin/id -u
          become: true
          register: rotation_final_sudo_test
          changed_when: false
          failed_when: >-
            rotation_final_sudo_test.rc != 0 or
            rotation_final_sudo_test.stdout | trim != '0'
          no_log: true

        - name: Mark server rotation successful
          ansible.builtin.set_fact:
            rotation_successful: true

      rescue:
        # ============================================================
        # Preserve recovery files on any failed rotation
        # ============================================================

        - name: Report rotation failure before server changes
          ansible.builtin.debug:
            msg: >-
              Rotation fuer {{ inventory_hostname }} vor jeglicher Serveraenderung
              fehlgeschlagen. Bestehende SSH- und sudo-Zugangsdaten sind unveraendert.
          when: not (rotation_remote_changes_started | default(false))

        - name: Report rotation failure after server changes
          ansible.builtin.debug:
            msg: >-
              Rotation fuer {{ inventory_hostname }} nach Beginn der Serveraenderungen
              fehlgeschlagen. Recovery-Dateien: {{ rotation_backup_dir }}.
              Wiederherstellung wird versucht; Sicherungen nicht loeschen.
          when: rotation_remote_changes_started | default(false)

        - name: Select usable SSH connection for rollback
          ansible.builtin.set_fact:
            ansible_private_key: >-
              {{ rotation_new_private_key if (rotation_new_ssh_verified | default(false)) else rotation_old_private_key }}
            ansible_private_key_passphrase: >-
              {{ generated_ssh_key_passphrase if (rotation_new_ssh_verified | default(false)) else rotation_old_key_passphrase }}
            ansible_become_password: >-
              {{ generated_sudo_password if (rotation_sudo_change_started | default(false)) else rotation_old_sudo_password }}
          when: rotation_remote_changes_started | default(false)
          no_log: true

        - name: Reset SSH connection for rollback
          ansible.builtin.meta: reset_connection

        - name: Restore original authorized_keys before reverting credentials
          ansible.builtin.copy:
            dest: "{{ rotation_authorized_keys_path }}"
            content: "{{ rotation_authorized_keys_before }}"
            owner: "{{ service_user.user_name }}"
            group: "{{ service_user.primary_group | default(service_user.user_name) }}"
            mode: '0600'
          when: rotation_remote_changes_started | default(false)
          no_log: true

        - name: Reconfigure original SSH identity
          ansible.builtin.set_fact:
            ansible_private_key: "{{ rotation_old_private_key }}"
            ansible_private_key_passphrase: "{{ rotation_old_key_passphrase }}"
          when: rotation_remote_changes_started | default(false)
          no_log: true

        - name: Reset connection to restored old key
          ansible.builtin.meta: reset_connection

        - name: Restore original sudo password
          when: rotation_sudo_change_started | default(false)
          block:
            - name: Try restoring sudo with new password
              ansible.builtin.set_fact:
                ansible_become_password: "{{ generated_sudo_password }}"
              no_log: true

            - name: Restore original service user password
              ansible.builtin.user:
                name: "{{ service_user.user_name }}"
                password: >-
                  {{
                    rotation_old_sudo_password
                    | ansible.builtin.password_hash(
                        'sha512',
                        salt=rotation_old_sudo_salt,
                        rounds=100000
                      )
                  }}
                update_password: always
                password_lock: false
              become: true
              no_log: true

          rescue:
            - name: Retry sudo rollback with old password
              ansible.builtin.set_fact:
                ansible_become_password: "{{ rotation_old_sudo_password }}"
              no_log: true

            - name: Restore original service user password using old credentials
              ansible.builtin.user:
                name: "{{ service_user.user_name }}"
                password: >-
                  {{
                    rotation_old_sudo_password
                    | ansible.builtin.password_hash(
                        'sha512',
                        salt=rotation_old_sudo_salt,
                        rounds=100000
                      )
                  }}
                update_password: always
                password_lock: false
              become: true
              no_log: true

        - name: Restore old sudo connection password
          ansible.builtin.set_fact:
            ansible_become_password: "{{ rotation_old_sudo_password }}"
          no_log: true

        - name: Verify original SSH connection after rollback
          ansible.builtin.wait_for_connection:
            connect_timeout: 5
            sleep: 2
            timeout: 40
          become: false
          when: rotation_remote_changes_started | default(false)

        - name: Verify original sudo authentication after rollback
          ansible.builtin.command:
            cmd: /usr/bin/id -u
          become: true
          register: rotation_rollback_sudo_test
          changed_when: false
          failed_when: >-
            rotation_rollback_sudo_test.rc != 0 or
            rotation_rollback_sudo_test.stdout | trim != '0'
          when: rotation_remote_changes_started | default(false)
          no_log: true

        - name: Restore original encrypted controller files
          ansible.builtin.copy:
            src: "{{ rotation_backup_dir }}/{{ item.name }}"
            dest: "{{ item.source }}"
            remote_src: true
            mode: "{{ '0644' if item.name == 'public_key.pub' else '0600' }}"
          delegate_to: localhost
          become: false
          loop: "{{ rotation_backup_files }}"
          loop_control:
            label: "{{ item.name }}"
          when: rotation_remote_changes_started | default(false)
          no_log: true

        - name: Mark verified rollback as complete
          ansible.builtin.set_fact:
            rotation_rollback_successful: true

        - name: Stop after completed rollback
          ansible.builtin.fail:
            msg: >-
              Rotation fuer {{ inventory_hostname }} fehlgeschlagen.
              {% if rotation_remote_changes_started | default(false) %}
              Der vorherige Zugriff wurde wiederhergestellt.
              Verschluesselte Sicherungen: {{ rotation_backup_dir }}.
              {% else %}
              Der Server wurde nicht veraendert; ein Rollback war nicht notwendig.
              {% endif %}

      always:
        - name: Remove unencrypted temporary SSH key files
          ansible.builtin.file:
            path: "{{ rotation_ssh_temp_dir.path }}"
            state: absent
          delegate_to: localhost
          become: false
          when:
            - rotation_ssh_temp_dir is defined
            - rotation_ssh_temp_dir.path is defined
          no_log: true

        - name: Remove incomplete local backup before any server changes
          ansible.builtin.file:
            path: "{{ rotation_backup_dir }}"
            state: absent
          delegate_to: localhost
          become: false
          when:
            - rotation_backup_created | default(false)
            - not (rotation_remote_changes_started | default(false))

        - name: Release acquired global Vault lock after success or verified rollback
          ansible.builtin.file:
            path: "{{ rotation_global_lock_dir }}"
            state: absent
          delegate_to: localhost
          become: false
          when:
            - rotation_global_lock_acquired | default(false)
            - >-
              (rotation_successful | default(false)) or
              (rotation_rollback_successful | default(false))

    - name: Delete rotation backup only after successful completion
      ansible.builtin.file:
        path: "{{ rotation_backup_dir }}"
        state: absent
      delegate_to: localhost
      become: false
      when: rotation_successful | default(false)

    - name: Confirm rotation success
      ansible.builtin.debug:
        msg: >-
          Alle serverspezifischen Secrets fuer {{ inventory_hostname }}
          wurden rotiert, persistiert und durch neue SSH- und sudo-Verbindungen geprueft.
