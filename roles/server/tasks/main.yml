---
- name: Load default variables
  ansible.builtin.include_vars:
    file: "{{ roles_dir }}/server/vars/default.yml"
    name: default

- name: Load package definitions
  ansible.builtin.include_vars:
    file: "{{ vars_dir }}/packages.yml"
    name: package_definitions

- name: Validate server role parameters
  ansible.builtin.include_tasks:
    file: "{{ tasks_dir }}/system/validate_server.yml"

- name: Update system packages
  ansible.builtin.include_tasks:
    file: "{{ roles_dir }}/server/tasks/update.yml"
  vars:
    server_apt_update_cache: "{{ host_specs.apt_update_cache | default(default.apt_update_cache) }}"
    server_apt_cache_valid_time: "{{ host_specs.apt_cache_valid_time | default(default.apt_cache_valid_time) }}"
    server_apt_upgrade: "{{ host_specs.apt_upgrade | default(default.apt_upgrade) }}"
    server_apt_upgrade_mode: "{{ host_specs.apt_upgrade_mode | default(default.apt_upgrade_mode) }}"
    server_apt_lock_timeout: "{{ host_specs.apt_lock_timeout | default(default.apt_lock_timeout) }}"

- name: Install standard server packages
  ansible.builtin.include_tasks:
    file: "{{ roles_dir }}/server/tasks/packages.yml"
  vars:
    host_packages: "{{ package_definitions.server_packages }}"

- name: Configure hostname
  ansible.builtin.include_tasks:
    file: "{{ roles_dir }}/server/tasks/hostname.yml"
  vars:
    host_name: "{{ host_specs.hostname }}"

- name: Configure local hosts
  ansible.builtin.include_tasks:
    file: "{{ roles_dir }}/server/tasks/hosts.yml"
  vars:
    host_name: "{{ host_specs.hostname }}"
    host_domain: "{{ host_specs.domain }}"

- name: Configure system locale
  ansible.builtin.include_tasks:
    file: "{{ roles_dir }}/server/tasks/locale.yml"
  vars:
    host_locale: "{{ host_specs.locale | default(default.locale) }}"

- name: Configure system timezone
  ansible.builtin.include_tasks:
    file: "{{ roles_dir }}/server/tasks/timezone.yml"
  vars:
    host_timezone: "{{ host_specs.timezone | default(default.timezone) }}"

- name: Configure NTP time synchronization
  ansible.builtin.include_tasks:
    file: "{{ roles_dir }}/server/tasks/ntp.yml"
  vars:
    host_ntp_server: "{{ host_specs.ntp_server | default(default.ntp_server) }}"
    host_ntp_waitsync_attempts: "{{ host_specs.ntp_waitsync_attempts | default(default.ntp_waitsync_attempts) }}"
    host_ntp_require_sync: "{{ host_specs.ntp_require_sync | default(default.ntp_require_sync) }}"

- name: Configure system journal
  ansible.builtin.include_tasks:
    file: "{{ roles_dir }}/server/tasks/journald.yml"
  vars:
    host_journald_system_max_use: "{{ host_specs.journald_system_max_use | default(default.journald_system_max_use) }}"
    host_journald_system_keep_free: "{{ host_specs.journald_system_keep_free | default(default.journald_system_keep_free) }}"
    host_journald_system_max_file_size: "{{ host_specs.journald_system_max_file_size | default(default.journald_system_max_file_size) }}"
    host_journald_max_retention: "{{ host_specs.journald_max_retention | default(default.journald_max_retention) }}"
    host_journald_max_file_sec: "{{ host_specs.journald_max_file_sec | default(default.journald_max_file_sec) }}"

- name: Configure logrotate
  ansible.builtin.include_tasks:
    file: "{{ roles_dir }}/server/tasks/logrotate.yml"
  vars:
    host_logrotate_frequency: "{{ host_specs.logrotate_frequency | default(default.logrotate_frequency) }}"
    host_logrotate_rotate: "{{ host_specs.logrotate_rotate | default(default.logrotate_rotate) }}"
    host_logrotate_compress: "{{ host_specs.logrotate_compress | default(default.logrotate_compress) }}"

- name: Reboot server if required
  ansible.builtin.include_tasks:
    file: "{{ roles_dir }}/server/tasks/reboot.yml"
  vars:
    host_reboot_if_required: "{{ host_specs.reboot_if_required | default(default.reboot_if_required) }}"
    host_reboot_timeout: "{{ host_specs.reboot_timeout | default(default.reboot_timeout) }}"
