---
- name: Configure NTP time synchronization
  ansible.builtin.include_tasks:
    file: "{{ tasks_dir }}/system/ntp.yml"
  vars:
    server_ntp_server: "{{ host_ntp_server }}"
    server_ntp_waitsync_attempts: "{{ host_ntp_waitsync_attempts }}"
    server_ntp_require_sync: "{{ host_ntp_require_sync }}"
