
---
# ============================================================
# System defaults
# ============================================================

locale: de_DE.UTF-8
timezone: Europe/Berlin

# ============================================================
# Chrony
# ============================================================

ntp_server: pool.ntp.org

# ============================================================
# Journald
# ============================================================

journald_system_max_use: 512M
journald_system_keep_free: 1G
journald_system_max_file_size: 64M
journald_max_retention: 30day
journald_max_file_sec: 1day

# ============================================================
# Logrotate
# ============================================================

logrotate_frequency: weekly
logrotate_rotate: 4
logrotate_compress: false

# ============================================================
# Reboot
# ============================================================

reboot_if_required: true
reboot_timeout: 900
