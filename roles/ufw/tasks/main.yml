---
# ============================================================
# Load role default variable
# ============================================================

- name: Load default variables
  ansible.builtin.include_vars:
    file: "{{ roles_dir }}/ufw/vars/default.yml"
    name: default

# ============================================================
# Install firewall packages
# ============================================================

- name: Install firewall packages
  ansible.builtin.include_tasks:
    file: "{{ tasks_dir }}/apt/install.yml"
  vars:
    apt_install_packages: "{{ firewall_packages }}"
    packages_state: present
  when: firewall_packages | length > 0
  



