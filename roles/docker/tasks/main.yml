---
# ============================================================
# Require successful server role completion in this Ansible run
# ============================================================

- name: Verify server role completed before Docker role
  ansible.builtin.assert:
    that:
      - server_role_completed | default(false) is sameas true
    fail_msg: >-
      The server role has not completed successfully in this Ansible run.
      Add 'server' before 'docker' in host_specs.host_roles.
    success_msg: "The server role completed successfully before Docker."

# ============================================================
# Load the single Docker package list
# ============================================================

- name: Load package definitions
  ansible.builtin.include_vars:
    file: "{{ vars_dir }}/packages.yml"
    name: package_definitions

# ============================================================
# Install Docker from the official APT repository
# ============================================================

- name: Install Docker packages
  ansible.builtin.include_tasks:
    file: "{{ tasks_dir }}/docker/install.yml"
  vars:
    docker_install_packages: "{{ package_definitions.docker_packages }}"

# ============================================================
# Load Docker defaults
# ============================================================

- name: Load Docker role defaults
  ansible.builtin.include_vars:
    file: "{{ roles_dir }}/docker/vars/default.yml"
    name: docker_defaults

# ============================================================
# Validate Docker role configuration after package installation
# ============================================================

- name: Validate Docker role configuration
  ansible.builtin.include_tasks:
    file: "{{ tasks_dir }}/docker/validate.yml"
  vars:
    docker_host_settings: "{{ (host_specifications | default({})).docker | default({}) }}"
    docker_service_enabled: >-
      {{
        ((host_specifications | default({})).docker | default({})).enabled
        | default(docker_defaults.enabled)
      }}

# ============================================================
# Daemon and service management will be added separately
# ============================================================