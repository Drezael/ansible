---
# ============================================================
# Validate policy parameters
# ============================================================

- name: Validate UFW policy parameters
  ansible.builtin.assert:
    that:
      - ufw_incoming_policy is defined
      - ufw_incoming_policy is string
      - ufw_incoming_policy in ['allow', 'deny', 'reject']
      - ufw_outgoing_policy is defined
      - ufw_outgoing_policy is string
      - ufw_outgoing_policy in ['allow', 'deny', 'reject']
    fail_msg: "UFW policies must be allow, deny or reject."

# ============================================================
# Resolve target policies
# ============================================================

- name: Resolve UFW policy targets
  ansible.builtin.set_fact:
    ufw_target_incoming: "{{ {'allow': 'ACCEPT', 'deny': 'DROP', 'reject': 'REJECT'}[ufw_incoming_policy] }}"
    ufw_target_outgoing: "{{ {'allow': 'ACCEPT', 'deny': 'DROP', 'reject': 'REJECT'}[ufw_outgoing_policy] }}"

# ============================================================
# Check current policy configuration
# ============================================================

- name: Check UFW defaults file
  ansible.builtin.stat:
    path: /etc/default/ufw
  register: ufw_policy_file_stat

- name: Verify UFW defaults file
  ansible.builtin.assert:
    that:
      - (ufw_policy_file_stat.stat.isreg | default(false)) or ansible_check_mode
    fail_msg: "UFW defaults file is missing. Install UFW first."

- name: Read current UFW defaults
  ansible.builtin.slurp:
    src: /etc/default/ufw
  register: ufw_policy_file
  when: ufw_policy_file_stat.stat.isreg | default(false)

# ============================================================
# Extract current policies
# ============================================================

- name: Extract current UFW policies
  ansible.builtin.set_fact:
    ufw_current_incoming: >-
      {{
        ufw_policy_file.content | b64decode
        | regex_findall('(?m)^DEFAULT_INPUT_POLICY *= *"?(ACCEPT|DROP|REJECT)"? *$')
        | first | default('')
      }}
    ufw_current_outgoing: >-
      {{
        ufw_policy_file.content | b64decode
        | regex_findall('(?m)^DEFAULT_OUTPUT_POLICY *= *"?(ACCEPT|DROP|REJECT)"? *$')
        | first | default('')
      }}
  when: ufw_policy_file_stat.stat.isreg | default(false)

- name: Validate existing UFW policies
  ansible.builtin.assert:
    that:
      - ufw_current_incoming in ['ACCEPT', 'DROP', 'REJECT']
      - ufw_current_outgoing in ['ACCEPT', 'DROP', 'REJECT']
    fail_msg: "Unable to determine existing UFW default policies."
  when: ufw_policy_file_stat.stat.isreg | default(false)

# ============================================================
# Configure incoming policy
# ============================================================

- name: Configure UFW incoming policy
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - default
      - "{{ ufw_incoming_policy }}"
      - incoming
  changed_when: true
  when:
    - not ansible_check_mode
    - ufw_current_incoming != ufw_target_incoming

# ============================================================
# Configure outgoing policy
# ============================================================

- name: Configure UFW outgoing policy
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - default
      - "{{ ufw_outgoing_policy }}"
      - outgoing
  changed_when: true
  when:
    - not ansible_check_mode
    - ufw_current_outgoing != ufw_target_outgoing

# ============================================================
# Report planned changes in check mode
# ============================================================

- name: Report planned incoming policy change
  ansible.builtin.debug:
    msg: "Incoming policy would change to {{ ufw_incoming_policy }}."
  changed_when: true
  when:
    - ansible_check_mode
    - ufw_current_incoming | default('') != ufw_target_incoming

- name: Report planned outgoing policy change
  ansible.builtin.debug:
    msg: "Outgoing policy would change to {{ ufw_outgoing_policy }}."
  changed_when: true
  when:
    - ansible_check_mode
    - ufw_current_outgoing | default('') != ufw_target_outgoing

# ============================================================
# Verify configured policies
# ============================================================

- name: Read final UFW defaults
  ansible.builtin.slurp:
    src: /etc/default/ufw
  register: ufw_policy_final
  when: not ansible_check_mode

- name: Verify UFW default policies
  ansible.builtin.assert:
    that:
      - >-
        (
          ufw_policy_final.content | b64decode
          | regex_findall('(?m)^DEFAULT_INPUT_POLICY *= *"?(ACCEPT|DROP|REJECT)"? *$')
          | first | default('')
        ) == ufw_target_incoming
      - >-
        (
          ufw_policy_final.content | b64decode
          | regex_findall('(?m)^DEFAULT_OUTPUT_POLICY *= *"?(ACCEPT|DROP|REJECT)"? *$')
          | first | default('')
        ) == ufw_target_outgoing
    fail_msg: "UFW default policies do not match the requested values."
  when: not ansible_check_mode