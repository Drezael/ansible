---
# Validate every input before installing packages or changing the firewall.
- name: Validate UFW configuration structure
  ansible.builtin.assert:
    that:
      - ufw_settings is mapping
      - ufw_settings.enabled | default(false) is boolean
      - ufw_settings.default_incoming | default('deny') in ['allow', 'deny', 'reject']
      - ufw_settings.default_outgoing | default('allow') in ['allow', 'deny', 'reject']
      - ufw_settings.rules | default([]) is sequence
      - ufw_settings.rules | default([]) is not string
      - ufw_settings.rules | default([]) is not mapping
      - ufw_settings.ssh_port | default(ansible_port | default(22)) | int >= 1
      - ufw_settings.ssh_port | default(ansible_port | default(22)) | int <= 65535
      - ufw_settings.ssh_port | default(ansible_port | default(22)) | string is match('^[0-9]+$')
      - (ufw_settings.ssh_port | default(ansible_port | default(22)) | int) == (ansible_port | default(22) | int)
    fail_msg: >-
      UFW-Konfiguration ungueltig. ssh_port muss mit dem Ansible-SSH-Port
      uebereinstimmen, damit die bestehende Verbindung geschuetzt bleibt.

- name: Validate user-defined UFW rules
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.action | default('') in ['allow', 'deny', 'reject', 'limit']
      - item.direction | default('in') in ['in', 'out']
      - item.protocol | default('tcp') in ['tcp', 'udp']
      - item.port is defined
      - item.port | string is match('^[0-9]+$')
      - item.port | int >= 1
      - item.port | int <= 65535
      - item.from_ip | default('any') is string
      - item.from_ip | default('any') is match('^[A-Za-z0-9.:/]+$')
      - item.to_ip | default('any') is string
      - item.to_ip | default('any') is match('^[A-Za-z0-9.:/]+$')
      - not (item.direction | default('in') == 'in' and item.protocol | default('tcp') == 'tcp' and item.port | int == (ufw_settings.ssh_port | default(ansible_port | default(22)) | int) and item.action != 'allow')
    fail_msg: "Ungueltige oder SSH-gefaehrdende Firewall-Regel: {{ item }}"
  loop: "{{ ufw_settings.rules | default([]) }}"
  loop_control:
    label: "{{ item.action | default('?') }} {{ item.direction | default('in') }} {{ item.port | default('?') }}/{{ item.protocol | default('tcp') }}"

- name: Install UFW
  ansible.builtin.include_tasks:
    file: "{{ tasks_dir }}/apt/install.yml"
  vars:
    apt_install_packages:
      - ufw
    packages_state: present

- name: Inspect current UFW status
  ansible.builtin.command:
    argv: [/usr/sbin/ufw, status, verbose]
  register: ufw_initial_status
  changed_when: false
  check_mode: false

# Never rely on the host's existing firewall rules to preserve SSH access.
- name: Allow current Ansible SSH port before firewall activation
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - allow
      - in
      - proto
      - tcp
      - from
      - any
      - to
      - any
      - port
      - "{{ ufw_settings.ssh_port | default(ansible_port | default(22)) | string }}"
  register: ufw_ssh_allow
  changed_when: "'Skipping adding existing rule' not in ufw_ssh_allow.stdout"
  when: not ansible_check_mode

- name: Configure incoming default policy
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - default
      - "{{ ufw_settings.default_incoming | default('deny') }}"
      - incoming
  register: ufw_default_in
  changed_when: true
  when:
    - not ansible_check_mode
    - "('Default: ' ~ (ufw_settings.default_incoming | default('deny')) ~ ' (incoming)') not in ufw_initial_status.stdout"

- name: Configure outgoing default policy
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - default
      - "{{ ufw_settings.default_outgoing | default('allow') }}"
      - outgoing
  register: ufw_default_out
  changed_when: true
  when:
    - not ansible_check_mode
    - "((ufw_settings.default_outgoing | default('allow')) ~ ' (outgoing)') not in ufw_initial_status.stdout"

- name: Apply configured firewall rules
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - "{{ item.action }}"
      - "{{ item.direction | default('in') }}"
      - proto
      - "{{ item.protocol | default('tcp') }}"
      - from
      - "{{ item.from_ip | default('any') }}"
      - to
      - "{{ item.to_ip | default('any') }}"
      - port
      - "{{ item.port | string }}"
  loop: "{{ ufw_settings.rules | default([]) }}"
  loop_control:
    label: "{{ item.action }} {{ item.direction | default('in') }} {{ item.port }}/{{ item.protocol | default('tcp') }}"
  register: ufw_rules_result
  changed_when: "'Skipping adding existing rule' not in ufw_rules_result.stdout"
  when: not ansible_check_mode

# Explicit opt-in: adding the role alone does NOT activate a firewall.
- name: Enable firewall when explicitly requested
  ansible.builtin.command:
    argv: [/usr/sbin/ufw, --force, enable]
  register: ufw_enable_result
  changed_when: true
  when:
    - not ansible_check_mode
    - ufw_settings.enabled | default(false)
    - "'Status: active' not in ufw_initial_status.stdout"

- name: Read final UFW status
  ansible.builtin.command:
    argv: [/usr/sbin/ufw, status, verbose]
  register: ufw_final_status
  changed_when: false
  check_mode: false

- name: Verify activation state when enabled
  ansible.builtin.assert:
    that:
      - "'Status: active' in ufw_final_status.stdout"
    fail_msg: "UFW sollte aktiviert sein, ist aber nicht aktiv."
  when:
    - not ansible_check_mode
    - ufw_settings.enabled | default(false)

- name: Report UFW state
  ansible.builtin.debug:
    msg:
      - "UFW configured; activation requested: {{ ufw_settings.enabled | default(false) }}"
      - "Ansible SSH TCP port protected: {{ ufw_settings.ssh_port | default(ansible_port | default(22)) }}"
      - "Check mode: {{ ansible_check_mode }}"
      - "{{ ufw_final_status.stdout }}"
