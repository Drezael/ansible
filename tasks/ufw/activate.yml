---
# ============================================================
# Validate activation parameters
# ============================================================

- name: Validate UFW activation parameters
  ansible.builtin.assert:
    that:
      - ufw_enabled is defined
      - ufw_enabled is boolean
    fail_msg: "ufw_enabled must be true or false."

# ============================================================
# Read current UFW state
# ============================================================

- name: Read current UFW status
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - status
  environment:
    LC_ALL: C
  register: ufw_current_status
  changed_when: false
  check_mode: false

# ============================================================
# Extract current UFW activation state
# ============================================================

- name: Extract current UFW activation state
  ansible.builtin.set_fact:
    ufw_current_state: >-
      {{
        ufw_current_status.stdout_lines
        | first
        | default('')
        | trim
      }}

# ============================================================
# Validate current UFW status
# ============================================================

- name: Validate current UFW status
  ansible.builtin.assert:
    that:
      - "ufw_current_state in ['Status: active', 'Status: inactive']"
    fail_msg: "Unable to determine current UFW status: {{ ufw_current_state }}"

# ============================================================
# Enable UFW
# ============================================================

- name: Enable UFW firewall
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - --force
      - enable
  changed_when: true
  when:
    - not ansible_check_mode
    - ufw_enabled
    - "ufw_current_state == 'Status: inactive'"

# ============================================================
# Disable UFW
# ============================================================

- name: Disable UFW firewall
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - --force
      - disable
  changed_when: true
  when:
    - not ansible_check_mode
    - not ufw_enabled
    - "ufw_current_state == 'Status: active'"

# ============================================================
# Report planned change in check mode
# ============================================================

- name: Report planned UFW activation change
  ansible.builtin.debug:
    msg: "UFW activation would change to {{ ufw_enabled }}."
  changed_when: true
  when:
    - ansible_check_mode
    - >-
      (ufw_enabled and ufw_current_state == 'Status: inactive')
      or
      (not ufw_enabled and ufw_current_state == 'Status: active')

# ============================================================
# Read final UFW state
# ============================================================

- name: Read final UFW status
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - status
  environment:
    LC_ALL: C
  register: ufw_final_status
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

# ============================================================
# Extract final UFW activation state
# ============================================================

- name: Extract final UFW activation state
  ansible.builtin.set_fact:
    ufw_final_state: >-
      {{
        ufw_final_status.stdout_lines
        | first
        | default('')
        | trim
      }}
  when: not ansible_check_mode

# ============================================================
# Verify final UFW activation state
# ============================================================

- name: Verify UFW activation state
  ansible.builtin.assert:
    that:
      - >-
        ufw_final_state ==
        ('Status: active' if ufw_enabled else 'Status: inactive')
    fail_msg: >-
      UFW activation state does not match the requested configuration.
      Requested: {{ 'active' if ufw_enabled else 'inactive' }}.
      Actual: {{ ufw_final_state }}.
    success_msg: >-
      UFW activation state verified successfully:
      {{ ufw_final_state }}.
  when: not ansible_check_mode