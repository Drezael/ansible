---
# ============================================================
# Enable UFW firewall
# ============================================================

- name: Enable UFW firewall
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - --force
      - enable
  register: ufw_enable_result
  changed_when: true
  when:
    - not ansible_check_mode
    - ufw_settings.enabled | default(false) | bool
    - "'Status: inactive' in ufw_initial_status.stdout"

# ============================================================
# Disable UFW firewall
# ============================================================

- name: Disable UFW firewall
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - --force
      - disable
  register: ufw_disable_result
  changed_when: true
  when:
    - not ansible_check_mode
    - not (ufw_settings.enabled | default(false) | bool)
    - "'Status: active' in ufw_initial_status.stdout"