---
# ============================================================
# Validate rule parameters
# ============================================================

- name: Validate UFW rule parameters
  ansible.builtin.assert:
    that:
      - ufw_rules is defined
      - ufw_rules is sequence
      - ufw_rules is not string
      - ufw_rules is not mapping
      - ufw_connection_port is defined
      - ufw_connection_port | string is match('^[0-9]+$')
      - ufw_connection_port | int >= 1
      - ufw_connection_port | int <= 65535
      - ufw_require_ssh_rule is defined
      - ufw_require_ssh_rule is boolean
    fail_msg: "Invalid UFW rule parameters."

# ============================================================
# Validate firewall rules
# ============================================================

- name: Validate UFW firewall rules
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.action | default('') in ['allow', 'deny', 'reject', 'limit']
      - item.direction | default('') in ['in', 'out']
      - item.protocol | default('') in ['tcp', 'udp']
      - item.port is defined
      - item.port | default('') | string is match('^[0-9]+$')
      - item.port | default(0) | int >= 1
      - item.port | default(0) | int <= 65535
      - item.from_ip | default('any') is string
      - item.to_ip | default('any') is string
    fail_msg: "Invalid UFW firewall rule: {{ item }}"
  loop: "{{ ufw_rules }}"
  loop_control:
    label: "{{ item.port | default('?') }}"

# ============================================================
# Verify explicit SSH access
# ============================================================

- name: Verify explicit Ansible SSH rule
  ansible.builtin.assert:
    that:
      - >-
        (
          ufw_rules
          | selectattr('action', 'equalto', 'allow')
          | selectattr('direction', 'equalto', 'in')
          | selectattr('protocol', 'equalto', 'tcp')
          | selectattr(
              'port',
              'in',
              [
                ufw_connection_port | int,
                ufw_connection_port | string
              ]
            )
          | list
          | length
        ) > 0
    fail_msg: >-
      No explicit allow rule exists for the Ansible SSH port.
      Firewall configuration aborted.
  when: ufw_require_ssh_rule

# ============================================================
# Apply firewall rules
# ============================================================

- name: Apply UFW firewall rules
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - "{{ item.action }}"
      - "{{ item.direction }}"
      - proto
      - "{{ item.protocol }}"
      - from
      - "{{ item.from_ip | default('any') }}"
      - to
      - "{{ item.to_ip | default('any') }}"
      - port
      - "{{ item.port | string }}"
  environment:
    LC_ALL: C
  register: ufw_rule_result
  changed_when: >-
    'Rule added' in ufw_rule_result.stdout
    or 'Rule updated' in ufw_rule_result.stdout
    or 'Rules updated' in ufw_rule_result.stdout
  loop: "{{ ufw_rules }}"
  loop_control:
    label: >-
      {{ item.action }}
      {{ item.direction }}
      {{ item.port }}/{{ item.protocol }}
  when: not ansible_check_mode

# ============================================================
# Preview firewall rules in check mode
# ============================================================

- name: Preview UFW firewall rules
  ansible.builtin.debug:
    msg: >-
      Desired rule:
      {{ item.action }}
      {{ item.direction }}
      {{ item.port }}/{{ item.protocol }}
      from {{ item.from_ip | default('any') }}
      to {{ item.to_ip | default('any') }}
  loop: "{{ ufw_rules }}"
  loop_control:
    label: "{{ item.port }}/{{ item.protocol }}"
  when: ansible_check_mode

# ============================================================
# Read configured firewall rules
# ============================================================

- name: Read configured UFW firewall rules
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - show
      - added
  environment:
    LC_ALL: C
  register: ufw_configured_rules
  changed_when: false
  check_mode: false
  when: not ansible_check_mode