---
# ============================================================
# Validate inputs passed by the calling role
# ============================================================

- name: Validate UFW rule management parameters
  ansible.builtin.assert:
    that:
      - ufw_rules is defined
      - ufw_rules is sequence
      - ufw_rules is not string
      - ufw_rules is not mapping
      - ufw_connection_port is defined
      - ufw_connection_port | string is match('^[0-9]+$')
      - ufw_connection_port | int >= 1
      - ufw_connection_port | int <= 65535
      - ufw_require_ssh_rule is defined
      - ufw_require_ssh_rule is boolean
      - ufw_allow_ssh_rule_removal is defined
      - ufw_allow_ssh_rule_removal is boolean
    fail_msg: "Invalid UFW rule management parameters."

- name: Validate desired UFW rules
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.action | default('') in ['allow', 'deny', 'reject', 'limit']
      - item.direction | default('') in ['in', 'out']
      - item.protocol | default('') in ['tcp', 'udp']
      - item.port is defined
      - item.port | default('') | string is match('^[0-9]+$')
      - item.port | default(0) | int >= 1
      - item.port | default(0) | int <= 65535
      - item.from_ip | default('any') is string
      - item.to_ip | default('any') is string
      - "(item.from_ip | default('any')) is match('^(any|[0-9A-Fa-f:.]+(/[0-9]{1,3})?)$')"
      - "(item.to_ip | default('any')) is match('^(any|[0-9A-Fa-f:.]+(/[0-9]{1,3})?)$')"
      - (item.keys() | list | difference(['action', 'direction', 'protocol', 'port', 'from_ip', 'to_ip'])) | length == 0
    fail_msg: "Invalid or unsupported UFW rule: {{ item }}"
  loop: "{{ ufw_rules }}"
  loop_control:
    label: "{{ item.port | default('?') }}"

# ============================================================
# Build desired rules and their content-derived managed tags
# ============================================================

- name: Initialize desired managed UFW rules
  ansible.builtin.set_fact:
    ufw_rules_desired: []

- name: Normalize desired managed UFW rules
  ansible.builtin.set_fact:
    ufw_rules_desired: >-
      {{
        ufw_rules_desired + [{
          'action': item.action,
          'direction': item.direction,
          'protocol': item.protocol,
          'port': item.port | int | string,
          'from_ip': item.from_ip | default('any'),
          'to_ip': item.to_ip | default('any'),
          'marker': 'ansible-ufw-v1-' ~ (
            ([item.action, item.direction, item.protocol,
              item.port | int | string,
              item.from_ip | default('any'),
              item.to_ip | default('any')] | join('|') | hash('sha256'))[:24]
          )
        }]
      }}
  loop: "{{ ufw_rules }}"
  loop_control:
    label: "{{ item.action }} {{ item.direction }} {{ item.port }}/{{ item.protocol }}"

- name: Validate unique desired UFW rules
  ansible.builtin.assert:
    that:
      - >-
        (ufw_rules_desired | map(attribute='marker') | list | length)
        ==
        (ufw_rules_desired | map(attribute='marker') | unique | list | length)
    fail_msg: "Duplicate desired UFW rules are not permitted."

- name: Require explicit SSH access under restrictive policies
  ansible.builtin.assert:
    that:
      - >-
        (
          ufw_rules_desired
          | selectattr('action', 'equalto', 'allow')
          | selectattr('direction', 'equalto', 'in')
          | selectattr('protocol', 'equalto', 'tcp')
          | selectattr('port', 'equalto', ufw_connection_port | string)
          | list | length
        ) > 0
    fail_msg: >-
      No explicit allow rule exists for the current Ansible SSH port.
      No SSH rule is ever added automatically.
  when: ufw_require_ssh_rule

# ============================================================
# Inspect all saved UFW user rules
# ============================================================

- name: Check for installed UFW binary
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: ufw_rules_binary

- name: Require installed UFW for rule reconciliation
  ansible.builtin.assert:
    that:
      - ufw_rules_binary.stat.exists or ansible_check_mode
    fail_msg: "UFW is not installed. Install it before configuring rules."

- name: Inspect existing UFW commands
  ansible.builtin.include_tasks:
    file: "{{ tasks_dir }}/ufw/inspect.yml"
  when: ufw_rules_binary.stat.exists

- name: Assume empty saved rules when UFW is absent in check mode
  ansible.builtin.set_fact:
    ufw_rules_managed: []
    ufw_rules_unmanaged_commands: []
  when:
    - ansible_check_mode
    - not ufw_rules_binary.stat.exists

- name: Preserve initial rule inventory
  ansible.builtin.set_fact:
    ufw_rules_before_managed: "{{ ufw_rules_managed }}"
    ufw_rules_before_unmanaged: "{{ ufw_rules_unmanaged_commands }}"
    ufw_rules_desired_markers: "{{ ufw_rules_desired | map(attribute='marker') | list }}"
    ufw_rules_present_valid_markers: []
    ufw_rules_stale: []

# The tag must match the actual fields. A tag alone is not proof.
- name: Compare actual managed rule contents with their tags
  ansible.builtin.set_fact:
    ufw_rules_present_valid_markers: >-
      {{
        ufw_rules_present_valid_markers +
        ([item.marker] if item.marker == item.actual_marker
          and item.marker in ufw_rules_desired_markers else [])
      }}
    ufw_rules_stale: >-
      {{
        ufw_rules_stale +
        ([item] if item.marker != item.actual_marker
          or item.marker not in ufw_rules_desired_markers else [])
      }}
  loop: "{{ ufw_rules_before_managed }}"
  loop_control:
    label: "{{ item.command }}"

- name: Determine missing desired UFW rules
  ansible.builtin.set_fact:
    ufw_rules_missing: >-
      {{
        ufw_rules_desired
        | rejectattr('marker', 'in', ufw_rules_present_valid_markers)
        | list
      }}

# ============================================================
# Inspect activation state before changes
# ============================================================

- name: Read current UFW activation status
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - status
  environment:
    LC_ALL: C
  register: ufw_rules_status
  changed_when: false
  check_mode: false
  when: ufw_rules_binary.stat.exists

- name: Extract current UFW activation state
  ansible.builtin.set_fact:
    ufw_rules_current_state: >-
      {{
        (ufw_rules_status.stdout_lines | default([]) | first | default('Status: inactive'))
        | trim
      }}

- name: Validate UFW activation state for rule reconciliation
  ansible.builtin.assert:
    that:
      - "ufw_rules_current_state in ['Status: active', 'Status: inactive']"
    fail_msg: "Unable to determine UFW state: {{ ufw_rules_current_state }}"

# ============================================================
# Add or adopt desired rules before removing obsolete rules
# ============================================================

- name: Add or adopt missing managed UFW rules
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - "{{ item.action }}"
      - "{{ item.direction }}"
      - proto
      - "{{ item.protocol }}"
      - from
      - "{{ item.from_ip }}"
      - to
      - "{{ item.to_ip }}"
      - port
      - "{{ item.port }}"
      - comment
      - "{{ item.marker }}"
  environment:
    LC_ALL: C
  changed_when: true
  loop: "{{ ufw_rules_missing }}"
  loop_control:
    label: "{{ item.action }} {{ item.direction }} {{ item.port }}/{{ item.protocol }}"
  when: not ansible_check_mode

- name: Inspect UFW rules after additions
  ansible.builtin.include_tasks:
    file: "{{ tasks_dir }}/ufw/inspect.yml"
  when: not ansible_check_mode

- name: Verify all desired managed UFW rules before deletion
  ansible.builtin.assert:
    that:
      - >-
        (
          ufw_rules_managed
          | selectattr('marker', 'equalto', item.marker)
          | selectattr('actual_marker', 'equalto', item.marker)
          | list | length
        ) == 1
    fail_msg: >-
      Expected rule {{ item.marker }} is not uniquely present with
      matching content. No old rules will be deleted.
  loop: "{{ ufw_rules_desired }}"
  loop_control:
    label: "{{ item.port }}/{{ item.protocol }}"
  when: not ansible_check_mode

# Deleting a rule by its specification might delete another rule with
# the same fields. Stop if an outdated tagged duplicate is still present.
- name: Find remaining obsolete Ansible-managed UFW rules
  ansible.builtin.set_fact:
    ufw_rules_stale_remaining: >-
      {{
        ufw_rules_stale
        | selectattr('command', 'in', ufw_rules_managed | map(attribute='command') | list)
        | list
      }}
  when: not ansible_check_mode

- name: Reject ambiguous duplicate UFW rules
  ansible.builtin.assert:
    that:
      - item.actual_marker not in ufw_rules_desired_markers
    fail_msg: >-
      Obsolete rule {{ item.command }} has the same network properties
      as a desired rule but a different tag. Deletion would be ambiguous.
  loop: "{{ ufw_rules_stale_remaining | default([]) }}"
  loop_control:
    label: "{{ item.command }}"
  when: not ansible_check_mode

# ============================================================
# Protect SSH if a deletion could change the controller's access
# ============================================================

- name: Identify obsolete managed SSH rules
  ansible.builtin.set_fact:
    ufw_rules_stale_ssh: >-
      {{
        (ufw_rules_stale_remaining if not ansible_check_mode else ufw_rules_stale)
        | selectattr('action', 'equalto', 'allow')
        | selectattr('direction', 'equalto', 'in')
        | selectattr('protocol', 'equalto', 'tcp')
        | selectattr('port', 'equalto', ufw_connection_port | string)
        | list
      }}

- name: Determine whether desired SSH access is unrestricted
  ansible.builtin.set_fact:
    ufw_rules_unrestricted_ssh: >-
      {{
        (
          ufw_rules_desired
          | selectattr('action', 'equalto', 'allow')
          | selectattr('direction', 'equalto', 'in')
          | selectattr('protocol', 'equalto', 'tcp')
          | selectattr('port', 'equalto', ufw_connection_port | string)
          | selectattr('from_ip', 'equalto', 'any')
          | selectattr('to_ip', 'equalto', 'any')
          | list | length
        ) > 0
      }}

- name: Guard against unsafe removal of active SSH rules
  ansible.builtin.assert:
    that:
      - >-
        ufw_rules_current_state != 'Status: active'
        or ufw_allow_ssh_rule_removal
        or (ufw_rules_stale_ssh | length == 0)
        or ufw_rules_unrestricted_ssh
    fail_msg: >-
      An obsolete managed SSH rule would be deleted while UFW is active.
      Provide an unrestricted replacement or explicitly allow this
      operation using firewall.allow_ssh_rule_removal=true.

# ============================================================
# Delete obsolete managed rules before unmanaged-rule cleanup
# ============================================================

- name: Delete obsolete Ansible-managed UFW rules
  ansible.builtin.command:
    argv: "{{ item.delete_argv }}"
  environment:
    LC_ALL: C
  changed_when: true
  loop: "{{ ufw_rules_stale_remaining | default([]) }}"
  loop_control:
    label: "{{ item.command }}"
  when: not ansible_check_mode

- name: Inspect UFW rules before unmanaged cleanup
  ansible.builtin.include_tasks:
    file: "{{ tasks_dir }}/ufw/inspect.yml"
  when: not ansible_check_mode

- name: Verify desired rules are still present
  ansible.builtin.assert:
    that:
      - >-
        (
          ufw_rules_managed
          | selectattr('marker', 'equalto', item.marker)
          | selectattr('actual_marker', 'equalto', item.marker)
          | list | length
        ) == 1
    fail_msg: >-
      A desired UFW rule disappeared while cleaning managed rules.
      Refusing to delete unmanaged rules.
  loop: "{{ ufw_rules_desired }}"
  loop_control:
    label: "{{ item.port }}/{{ item.protocol }}"
  when: not ansible_check_mode

# A valid managed tag is the only exemption from cleanup.
# Other UFW user rules are removed, including rules with malformed tags.
- name: Identify unmanaged SSH rules
  ansible.builtin.set_fact:
    ufw_rules_unmanaged_ssh: >-
      {{
        (ufw_rules_before_unmanaged if ansible_check_mode else ufw_rules_unmanaged_commands)
        | select('match', '^ufw (allow|limit) ')
        | select('search', '(?i)(?:^|[ /])' ~ (ufw_connection_port | string) ~ '(?:/tcp)?(?= |$)|(?:^| )(?:ssh|openssh)(?= |$)')
        | list
      }}

- name: Guard against unsafe removal of unmanaged SSH rules
  ansible.builtin.assert:
    that:
      - >-
        ufw_rules_current_state != 'Status: active'
        or ufw_allow_ssh_rule_removal
        or (ufw_rules_unmanaged_ssh | length == 0)
        or ufw_rules_unrestricted_ssh
    fail_msg: >-
      An unmanaged SSH rule would be deleted while UFW is active.
      Provide an unrestricted managed SSH replacement or set
      firewall.allow_ssh_rule_removal=true after verifying access.

# This command module uses shell-like argument parsing but does NOT run a shell.
# It preserves quoted application profiles and comments from 'ufw show added'.
- name: Delete all UFW rules without a valid managed tag
  ansible.builtin.command:
    cmd: >-
      /usr/sbin/ufw --force
      {{ 'route delete' if item is match('^ufw route ') else 'delete' }}
      {{ item | regex_replace('^ufw (route )?', '') }}
  environment:
    LC_ALL: C
  changed_when: true
  loop: "{{ ufw_rules_unmanaged_commands }}"
  loop_control:
    label: "{{ item }}"
  when: not ansible_check_mode

# ============================================================
# Check mode: report both obsolete tagged and untagged rules
# ============================================================

- name: Preview missing managed UFW rules
  ansible.builtin.debug:
    msg: >-
      Would add or adopt {{ item.action }} {{ item.direction }}
      {{ item.port }}/{{ item.protocol }} from {{ item.from_ip }} to {{ item.to_ip }}.
  changed_when: true
  loop: "{{ ufw_rules_missing }}"
  loop_control:
    label: "{{ item.port }}/{{ item.protocol }}"
  when: ansible_check_mode

- name: Preview obsolete managed UFW rules
  ansible.builtin.debug:
    msg: "Would remove obsolete managed rule: {{ item.command }}"
  changed_when: true
  loop: "{{ ufw_rules_stale }}"
  loop_control:
    label: "{{ item.command }}"
  when: ansible_check_mode

- name: Preview unmanaged UFW rules to remove or adopt
  ansible.builtin.debug:
    msg: "Would delete or adopt unmanaged rule: {{ item }}"
  changed_when: true
  loop: "{{ ufw_rules_before_unmanaged }}"
  loop_control:
    label: "{{ item }}"
  when: ansible_check_mode

# ============================================================
# Verify complete and exclusive control of UFW user rules
# ============================================================

- name: Inspect final saved UFW commands
  ansible.builtin.include_tasks:
    file: "{{ tasks_dir }}/ufw/inspect.yml"
  when: not ansible_check_mode

- name: Verify all desired rules have exact managed content
  ansible.builtin.assert:
    that:
      - >-
        (
          ufw_rules_managed
          | selectattr('marker', 'equalto', item.marker)
          | selectattr('actual_marker', 'equalto', item.marker)
          | list | length
        ) == 1
    fail_msg: "Desired rule is missing or duplicated: {{ item.marker }}"
  loop: "{{ ufw_rules_desired }}"
  loop_control:
    label: "{{ item.port }}/{{ item.protocol }}"
  when: not ansible_check_mode

- name: Verify no unmanaged or obsolete UFW user rules remain
  ansible.builtin.assert:
    that:
      - (ufw_rules_unmanaged_commands | length) == 0
      - (ufw_rules_managed | length) == (ufw_rules_desired | length)
      - >-
        (
          ufw_rules_managed
          | rejectattr('marker', 'in', ufw_rules_desired_markers)
          | list | length
        ) == 0
    fail_msg: >-
      UFW still contains unmanaged rules or obsolete Ansible rules.
      Firewall reconciliation is incomplete.
  when: not ansible_check_mode

- name: Verify no rule differs from its managed fingerprint
  ansible.builtin.assert:
    that:
      - item.marker == item.actual_marker
    fail_msg: "UFW rule content differs from its tag: {{ item.command }}"
  loop: "{{ ufw_rules_managed }}"
  loop_control:
    label: "{{ item.command }}"
  when: not ansible_check_mode