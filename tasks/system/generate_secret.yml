---
# ============================================================
# Generate random secret
# ============================================================

- name: Generate random secret
  ansible.builtin.set_fact:
    "{{ secret_variable_name }}": >-
      {{
        lookup(
          'ansible.builtin.password',
          '/dev/null',
          length=(secret_length | default(64) | int),
          chars=['ascii_letters', 'digits']
        )
      }}
  no_log: true