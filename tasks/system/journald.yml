---
# ============================================================
# Validate Journald settings
# ============================================================

- name: Validate Journald storage settings
  ansible.builtin.assert:
    that:
      - server_journald_system_max_use is match('^[0-9]+[KMGT]$')
      - server_journald_system_keep_free is match('^[0-9]+[KMGT]$')
      - server_journald_system_max_file_size is match('^[0-9]+[KMGT]$')
      - server_journald_max_retention is match('^[0-9]+(?:s|sec|min|h|day|week|month|year)$')
      - server_journald_max_file_sec is match('^[0-9]+(?:s|sec|min|h|day|week|month|year)$')
    fail_msg: "Invalid Journald configuration."

# ============================================================
# Prepare Journald configuration
# ============================================================

- name: Create Journald configuration directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

# ============================================================
# Configure Journald
# ============================================================

- name: Configure Journald retention
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-ansible.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse={{ server_journald_system_max_use }}
      SystemKeepFree={{ server_journald_system_keep_free }}
      SystemMaxFileSize={{ server_journald_system_max_file_size }}
      MaxRetentionSec={{ server_journald_max_retention }}
      MaxFileSec={{ server_journald_max_file_sec }}
  register: journald_configuration

# ============================================================
# Apply Journald configuration
# ============================================================

- name: Restart Journald after configuration changes
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted
  when: journald_configuration.changed

- name: Flush journal to persistent storage
  ansible.builtin.command:
    argv:
      - /usr/bin/journalctl
      - --flush
  changed_when: true
  when: journald_configuration.changed

# ============================================================
# Verify Journald
# ============================================================

- name: Read Journald disk usage
  ansible.builtin.command:
    argv:
      - /usr/bin/journalctl
      - --disk-usage
  register: journald_disk_usage
  changed_when: false

- name: Report Journald configuration
  ansible.builtin.debug:
    msg:
      - "SystemMaxUse: {{ server_journald_system_max_use }}"
      - "SystemKeepFree: {{ server_journald_system_keep_free }}"
      - "MaxRetentionSec: {{ server_journald_max_retention }}"
      - "{{ journald_disk_usage.stdout }}"
