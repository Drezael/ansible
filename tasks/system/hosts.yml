---
- name: Configure local hostname resolution
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1(\s|$)'
    line: "127.0.1.1 {{ server_hostname }}.{{ server_domain }} {{ server_hostname }}"
    state: present
    create: false

- name: Read system FQDN
  ansible.builtin.command:
    cmd: hostname -f
  register: system_fqdn
  changed_when: false

- name: Verify system FQDN
  ansible.builtin.assert:
    that:
      - system_fqdn.stdout == server_hostname ~ '.' ~ server_domain
    fail_msg: "Der konfigurierte FQDN stimmt nicht mit der Serverdefinition überein."

- name: Verify local hostname resolution
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - "{{ server_hostname }}.{{ server_domain }}"
  register: hostname_resolution
  changed_when: false
  failed_when: >-
    hostname_resolution.rc != 0
    or '127.0.1.1' not in hostname_resolution.stdout