---
# ============================================================
# Validate Logrotate configuration
# ============================================================

- name: Validate Logrotate settings
  ansible.builtin.assert:
    that:
      - server_logrotate_frequency in ['daily', 'weekly', 'monthly', 'yearly']
      - server_logrotate_rotate | int >= 1
      - server_logrotate_compress is boolean
    fail_msg: "Invalid Logrotate configuration."

# ============================================================
# Remove obsolete Ansible policy block
# ============================================================

- name: Remove previous Ansible Logrotate policy block
  ansible.builtin.blockinfile:
    path: /etc/logrotate.conf
    marker: '# {mark} ANSIBLE MANAGED LOGROTATE POLICY'
    state: absent
    backup: true

# ============================================================
# Configure rotation frequency
# ============================================================

- name: Configure Logrotate frequency
  ansible.builtin.lineinfile:
    path: /etc/logrotate.conf
    regexp: '^[ \t]*(?:daily|weekly|monthly|yearly)[ \t]*$'
    line: "{{ server_logrotate_frequency }}"
    insertbefore: '^[ \t]*include[ \t]+/etc/logrotate\.d[ \t]*$'
    state: present
    backup: true

# ============================================================
# Configure rotation count
# ============================================================

- name: Configure Logrotate retention count
  ansible.builtin.lineinfile:
    path: /etc/logrotate.conf
    regexp: '^[ \t]*rotate[ \t]+[0-9]+[ \t]*$'
    line: "rotate {{ server_logrotate_rotate | int }}"
    insertbefore: '^[ \t]*include[ \t]+/etc/logrotate\.d[ \t]*$'
    state: present
    backup: true

# ============================================================
# Configure compression
# ============================================================

- name: Configure Logrotate compression
  ansible.builtin.lineinfile:
    path: /etc/logrotate.conf
    regexp: '^[ \t]*#?[ \t]*(?:compress|nocompress)[ \t]*$'
    line: "{{ 'compress' if server_logrotate_compress | bool else 'nocompress' }}"
    insertbefore: '^[ \t]*include[ \t]+/etc/logrotate\.d[ \t]*$'
    state: present
    backup: true

# ============================================================
# Enable Logrotate timer
# ============================================================

- name: Enable Logrotate timer
  ansible.builtin.systemd_service:
    name: logrotate.timer
    enabled: true
    state: started

# ============================================================
# Validate Logrotate configuration
# ============================================================

- name: Validate Logrotate configuration
  ansible.builtin.command:
    argv:
      - /usr/sbin/logrotate
      - --debug
      - /etc/logrotate.conf
  changed_when: false

# ============================================================
# Verify Logrotate timer
# ============================================================

- name: Verify Logrotate timer
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-enabled
      - logrotate.timer
  register: logrotate_timer_status
  changed_when: false
  failed_when: >-
    logrotate_timer_status.rc != 0
    or logrotate_timer_status.stdout | trim != 'enabled'

# ============================================================
# Report Logrotate configuration
# ============================================================

- name: Report Logrotate configuration
  ansible.builtin.debug:
    msg:
      - "Frequency: {{ server_logrotate_frequency }}"
      - "Rotations: {{ server_logrotate_rotate }}"
      - "Compression: {{ server_logrotate_compress }}"
