---
- name: Validate Logrotate settings
  ansible.builtin.assert:
    that:
      - server_logrotate_frequency in ['daily', 'weekly', 'monthly', 'yearly']
      - server_logrotate_rotate is integer
      - server_logrotate_rotate >= 1
      - server_logrotate_compress is boolean
    fail_msg: "Ungueltige Logrotate-Einstellungen."

- name: Remove previous Ansible Logrotate policy block
  ansible.builtin.blockinfile:
    path: /etc/logrotate.conf
    marker: '# {mark} ANSIBLE MANAGED LOGROTATE POLICY'
    state: absent
    backup: true
  register: logrotate_legacy_cleanup

- name: Configure Logrotate frequency
  ansible.builtin.lineinfile:
    path: /etc/logrotate.conf
    regexp: '^[ \t]*(?:daily|weekly|monthly|yearly)[ \t]*$'
    line: "{{ server_logrotate_frequency }}"
    insertbefore: '^[ \t]*include[ \t]+/etc/logrotate\.d[ \t]*$'
    state: present
    backup: true
  register: logrotate_frequency_configuration

- name: Configure Logrotate retention count
  ansible.builtin.lineinfile:
    path: /etc/logrotate.conf
    regexp: '^[ \t]*rotate[ \t]+[0-9]+[ \t]*$'
    line: "rotate {{ server_logrotate_rotate }}"
    insertbefore: '^[ \t]*include[ \t]+/etc/logrotate\.d[ \t]*$'
    state: present
    backup: true
  register: logrotate_retention_configuration

- name: Configure Logrotate compression
  ansible.builtin.lineinfile:
    path: /etc/logrotate.conf
    regexp: '^[ \t]*#?[ \t]*(?:compress|nocompress)[ \t]*$'
    line: "{{ 'compress' if server_logrotate_compress else 'nocompress' }}"
    insertbefore: '^[ \t]*include[ \t]+/etc/logrotate\.d[ \t]*$'
    state: present
    backup: true
  register: logrotate_compression_configuration

- name: Determine whether Logrotate configuration would change
  ansible.builtin.set_fact:
    logrotate_configuration_pending: >-
      {{ logrotate_legacy_cleanup.changed or logrotate_frequency_configuration.changed or
         logrotate_retention_configuration.changed or logrotate_compression_configuration.changed }}

- name: Enable Logrotate timer
  ansible.builtin.systemd_service:
    name: logrotate.timer
    enabled: true
    state: started

- name: Validate Logrotate configuration
  ansible.builtin.command:
    argv:
      - /usr/sbin/logrotate
      - --debug
      - /etc/logrotate.conf
  changed_when: false
  check_mode: false
  when: not ansible_check_mode or not logrotate_configuration_pending | bool

- name: Verify Logrotate timer
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-enabled
      - logrotate.timer
  register: logrotate_timer_status
  changed_when: false
  check_mode: false
  failed_when: >-
    logrotate_timer_status.rc != 0 or logrotate_timer_status.stdout | trim != 'enabled'
  when: not ansible_check_mode

- name: Report Logrotate configuration
  ansible.builtin.debug:
    msg:
      - "Frequency: {{ server_logrotate_frequency }}"
      - "Rotations: {{ server_logrotate_rotate }}"
      - "Compression: {{ server_logrotate_compress }}"
      - "Changes pending (check mode): {{ ansible_check_mode and logrotate_configuration_pending | bool }}"
