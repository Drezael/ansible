---
- name: Normalize Chrony sources
  ansible.builtin.set_fact:
    server_chrony_sources: >-
      {{ [server_ntp_server] if server_ntp_server is string else server_ntp_server | list }}

- name: Validate Chrony source entries
  ansible.builtin.assert:
    that:
      - item is string
      - item | length > 0
      - item | length <= 253
      - item is match('^[A-Za-z0-9:][A-Za-z0-9._:-]*$')
    fail_msg: "Ungueltiger NTP-Server: {{ item }}"
  loop: "{{ server_chrony_sources }}"

- name: Validate Chrony source uniqueness
  ansible.builtin.assert:
    that:
      - server_chrony_sources | length > 0
      - server_chrony_sources | unique | list | length == server_chrony_sources | length
    fail_msg: "Mindestens eine eindeutige NTP-Quelle ist erforderlich."

- name: Ensure Chrony sources directory exists
  ansible.builtin.file:
    path: /etc/chrony/sources.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  register: chrony_directory

- name: Ensure Chrony loads custom NTP sources
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^[ \t]*#?[ \t]*sourcedir[ \t]+/etc/chrony/sources\.d[ \t]*$'
    line: 'sourcedir /etc/chrony/sources.d'
    state: present
    backup: true
  register: chrony_source_directory

- name: Disable default NTP sources in chrony.conf
  ansible.builtin.replace:
    path: /etc/chrony/chrony.conf
    regexp: '^([ \t]*(?:pool|server|peer)[ \t]+[^\r\n]+)$'
    replace: '# Disabled by Ansible: \1'
    backup: true
  register: chrony_default_sources

- name: Check Ubuntu default NTP source file
  ansible.builtin.stat:
    path: /etc/chrony/sources.d/ubuntu-ntp-pools.sources
  register: chrony_ubuntu_sources_file

- name: Disable Ubuntu default NTP source file
  ansible.builtin.replace:
    path: /etc/chrony/sources.d/ubuntu-ntp-pools.sources
    regexp: '^([ \t]*(?:pool|server|peer)[ \t]+[^\r\n]+)$'
    replace: '# Disabled by Ansible: \1'
    backup: true
  register: chrony_ubuntu_sources
  when: chrony_ubuntu_sources_file.stat.isreg | default(false)

- name: Disable DHCP NTP sources
  ansible.builtin.replace:
    path: /etc/chrony/chrony.conf
    regexp: '^([ \t]*sourcedir[ \t]+/run/chrony-dhcp(?:[ \t]+[^\r\n]*)?)$'
    replace: '# Disabled by Ansible: \1'
    backup: true
  register: chrony_dhcp_sources

- name: Configure Chrony NTP sources
  ansible.builtin.copy:
    dest: /etc/chrony/sources.d/99-ansible.sources
    owner: root
    group: root
    mode: '0644'
    backup: true
    content: |
      # Managed by Ansible; edit host_specs.ntp_server instead.
      {% for source in server_chrony_sources %}
      {{ 'pool' if source == 'pool.ntp.org' or source.endswith('.pool.ntp.org') else 'server' }} {{ source }} iburst
      {% endfor %}
  register: chrony_ntp_configuration

- name: Determine whether Chrony configuration would change
  ansible.builtin.set_fact:
    chrony_configuration_pending: >-
      {{ chrony_directory.changed or chrony_source_directory.changed or
         chrony_default_sources.changed or (chrony_ubuntu_sources.changed | default(false)) or
         chrony_dhcp_sources.changed or chrony_ntp_configuration.changed }}

- name: Validate Chrony configuration syntax
  ansible.builtin.command:
    argv:
      - /usr/sbin/chronyd
      - -p
      - -f
      - /etc/chrony/chrony.conf
  changed_when: false
  check_mode: false
  when: not ansible_check_mode or not chrony_configuration_pending | bool

- name: Gather service information
  ansible.builtin.service_facts:

- name: Disable systemd-timesyncd if installed
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    enabled: false
    state: stopped
  when: "'systemd-timesyncd.service' in ansible_facts.services"

- name: Enable and start Chrony
  ansible.builtin.systemd_service:
    name: chrony.service
    enabled: true
    state: "{{ 'restarted' if chrony_configuration_pending | bool else 'started' }}"
  when: not ansible_check_mode

- name: Wait for Chrony synchronization
  ansible.builtin.command:
    argv:
      - /usr/bin/chronyc
      - waitsync
      - "{{ server_ntp_waitsync_attempts | int }}"
  register: chrony_waitsync
  changed_when: false
  failed_when: server_ntp_require_sync | bool and chrony_waitsync.rc != 0
  check_mode: false
  when: not ansible_check_mode or not chrony_configuration_pending | bool

- name: Read Chrony tracking information
  ansible.builtin.command:
    argv:
      - /usr/bin/chronyc
      - tracking
  register: chrony_tracking
  changed_when: false
  check_mode: false
  when: not ansible_check_mode or not chrony_configuration_pending | bool

- name: Report Chrony configuration
  ansible.builtin.debug:
    msg:
      - "NTP sources: {{ server_chrony_sources | join(', ') }}"
      - "Changes pending (check mode): {{ ansible_check_mode and chrony_configuration_pending | bool }}"
      - "Synchronization required: {{ server_ntp_require_sync }}"
      - "{{ chrony_tracking.stdout | default('Tracking not checked because configuration changes are pending.') }}"
