---
# ============================================================
# Validate Chrony configuration
# ============================================================

- name: Validate NTP server
  ansible.builtin.assert:
    that:
      - server_ntp_server is string
      - server_ntp_server | length > 0
      - server_ntp_server | length <= 253
      - server_ntp_server is match('^[A-Za-z0-9:][A-Za-z0-9._:-]*$')
    fail_msg: "Invalid NTP server configuration."

# ============================================================
# Prepare Chrony configuration
# ============================================================

- name: Ensure Chrony sources directory exists
  ansible.builtin.file:
    path: /etc/chrony/sources.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure Chrony loads custom NTP sources
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^[ \t]*#?[ \t]*sourcedir[ \t]+/etc/chrony/sources\.d[ \t]*$'
    line: 'sourcedir /etc/chrony/sources.d'
    state: present
  register: chrony_source_directory

# ============================================================
# Disable default NTP sources
# ============================================================

- name: Disable default NTP sources in chrony.conf
  ansible.builtin.replace:
    path: /etc/chrony/chrony.conf
    regexp: '^([ \t]*(?:pool|server|peer)[ \t]+[^\r\n]+)$'
    replace: '# Disabled by Ansible: \1'
    backup: true
  register: chrony_default_sources

- name: Check Ubuntu default NTP source file
  ansible.builtin.stat:
    path: /etc/chrony/sources.d/ubuntu-ntp-pools.sources
  register: chrony_ubuntu_sources_file

- name: Disable Ubuntu default NTP source file
  ansible.builtin.replace:
    path: /etc/chrony/sources.d/ubuntu-ntp-pools.sources
    regexp: '^([ \t]*(?:pool|server|peer)[ \t]+[^\r\n]+)$'
    replace: '# Disabled by Ansible: \1'
    backup: true
  register: chrony_ubuntu_sources
  when: chrony_ubuntu_sources_file.stat.isreg | default(false)

# ============================================================
# Disable DHCP-provided NTP sources
# ============================================================

- name: Disable DHCP NTP sources
  ansible.builtin.replace:
    path: /etc/chrony/chrony.conf
    regexp: '^([ \t]*sourcedir[ \t]+/run/chrony-dhcp(?:[ \t]+[^\r\n]*)?)$'
    replace: '# Disabled by Ansible: \1'
    backup: true
  register: chrony_dhcp_sources

# ============================================================
# Configure Ansible NTP source
# ============================================================

- name: Configure Chrony NTP source
  ansible.builtin.copy:
    dest: /etc/chrony/sources.d/99-ansible.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      {{ 'pool' if server_ntp_server == 'pool.ntp.org' or server_ntp_server.endswith('.pool.ntp.org') else 'server' }} {{ server_ntp_server }} iburst
  register: chrony_ntp_configuration

# ============================================================
# Validate Chrony configuration
# ============================================================

- name: Validate Chrony configuration syntax
  ansible.builtin.command:
    argv:
      - /usr/sbin/chronyd
      - -p
      - -f
      - /etc/chrony/chrony.conf
  changed_when: false

# ============================================================
# Disable conflicting time services
# ============================================================

- name: Gather service information
  ansible.builtin.service_facts:

- name: Disable systemd-timesyncd if installed
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    enabled: false
    state: stopped
  when: "'systemd-timesyncd.service' in ansible_facts.services"

# ============================================================
# Enable and start Chrony
# ============================================================

- name: Enable and start Chrony
  ansible.builtin.systemd_service:
    name: chrony.service
    enabled: true
    state: >-
      {{ 'restarted' if
         chrony_source_directory.changed
         or chrony_default_sources.changed
         or (chrony_ubuntu_sources.changed | default(false))
         or chrony_dhcp_sources.changed
         or chrony_ntp_configuration.changed
         else 'started' }}

# ============================================================
# Verify Chrony synchronization
# ============================================================

- name: Wait for Chrony synchronization
  ansible.builtin.command:
    argv:
      - /usr/bin/chronyc
      - waitsync
      - "12"
  changed_when: false

- name: Read Chrony tracking information
  ansible.builtin.command:
    argv:
      - /usr/bin/chronyc
      - tracking
  register: chrony_tracking
  changed_when: false

# ============================================================
# Report Chrony status
# ============================================================

- name: Report Chrony configuration
  ansible.builtin.debug:
    msg:
      - "Chrony configured successfully."
      - "NTP source: {{ server_ntp_server }}"
      - "Synchronization verified."
      - "{{ chrony_tracking.stdout }}"
