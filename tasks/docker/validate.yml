---
# ============================================================
# Validate all supplied Docker role settings
# ============================================================

- name: Validate Docker role parameters
  ansible.builtin.assert:
    that:
      - host_specifications is defined
      - host_specifications is mapping
      - docker_defaults is mapping
      - docker_defaults.enabled is boolean
      - docker_host_settings is mapping
      - (docker_host_settings.keys() | list | difference(['enabled'])) | length == 0
      - docker_service_enabled is boolean
    fail_msg: >-
      Invalid Docker settings. Set host_specifications.docker to a mapping
      containing only the optional boolean key 'enabled'.

# ============================================================
# Display detected operating system information
# ============================================================

- name: Display detected Docker host platform
  ansible.builtin.debug:
    msg:
      distribution: "{{ ansible_facts['distribution'] | default('unknown') }}"
      version: "{{ ansible_facts['distribution_version'] | default('unknown') }}"
      release: "{{ ansible_facts['distribution_release'] | default('unknown') }}"
      architecture: "{{ ansible_facts['architecture'] | default('unknown') }}"
      package_manager: "{{ ansible_facts['pkg_mgr'] | default('unknown') }}"

# ============================================================
# Validate supported operating system
# ============================================================

- name: Validate supported Docker platform
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] | default('') == 'Linux'
      - ansible_facts['distribution'] | default('') == 'Ubuntu'
      - >-
        (ansible_facts['distribution_version'] | default('') | string)
        in ['22.04', '24.04', '26.04', '26.10']
      - ansible_facts['pkg_mgr'] | default('') == 'apt'
    fail_msg: >-
      Unsupported Docker platform.
      Detected:
      {{ ansible_facts['distribution'] | default('unknown') }}
      {{ ansible_facts['distribution_version'] | default('unknown') }}.
      Supported Ubuntu versions: 22.04, 24.04, 26.04, 26.10.
    success_msg: >-
      Docker platform validation successful:
      {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}.