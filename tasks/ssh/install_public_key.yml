---

- name: Create SSH directory
  ansible.builtin.include_tasks:
    file: "{{ tasks_dir }}/system/create_directory.yml"
  vars:
    path: "/home/{{ ssh_user_name }}/.ssh"
    owner: "{{ ssh_user_name }}"    
    owner_group: "{{ ssh_user_primary_group }}"
    mode: '0700'

- name: Install SSH public key
  ansible.builtin.copy:
    src: "{{ public_keys_dir }}/{{ key_name }}.pub"
    dest: "/home/{{ ssh_user_name }}/.ssh/authorized_keys"
    owner: "{{ ssh_user_name }}"
    group: "{{ ssh_user_primary_group }}"
    mode: '0600'